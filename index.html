<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>חבורת הלכה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231E4E8C'/><path d='M50 30c-6-4-14-6-22-6v46c8 0 16 2 22 6 6-4 14-6 22-6V24c-8 0-16 2-22 6z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/><path d='M50 30v46' stroke='white' stroke-width='5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBFD; --card:#FFFFFF; --ink:#1C1C22; --muted:#71717A; --line:#E8E8ED;
  --blue:#1E4E8C; --blue-d:#173E71; --blue-soft:#EEF3FA;
  --gold:#A8873B; --gold-soft:#F7F1E3;
  --green:#2E7D5B; --green-soft:#E9F4EF;
  --red:#C0453C; --red-soft:#FBEDEC;
  --radius:18px;
  --shadow:0 1px 2px rgba(28,28,34,.04), 0 8px 28px rgba(28,28,34,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Assistant',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.55}
h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:#ABABB4}
svg{display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#F3F3F7 0%, var(--paper) 55%)}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:40px 32px 32px;box-shadow:var(--shadow);text-align:center;position:relative}
.auth-mark{width:64px;height:64px;border-radius:19px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 24px rgba(30,78,140,.28)}
.auth-card h1{font-size:30px;font-weight:900;margin-bottom:4px}
.auth-sub{color:var(--muted);margin-bottom:26px;font-size:15px}
.auth-lang{position:absolute;top:16px;inset-inline-end:16px}
.field{text-align:start;margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#FBFBFD}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);outline:none;background:#fff}
.auth-err{display:none;background:var(--red-soft);color:var(--red);border-radius:11px;padding:10px 14px;font-size:14px;margin-bottom:14px;text-align:start}
.auth-switch{margin-top:18px;font-size:14px;color:var(--muted)}
.auth-switch button{color:var(--blue);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:600;font-size:15px;padding:11px 22px;border-radius:999px;transition:background .15s, transform .1s}
.btn:hover{background:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid #C9D6E8}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.soft:hover{background:#E1EAF6}
.btn.danger{background:transparent;color:var(--red);border:1px solid #EACFCC}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:7px 15px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.iconbtn{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s;flex:none}
.iconbtn:hover{background:#EFEFF4;color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

header{position:sticky;top:0;z-index:50;background:rgba(251,251,253,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hbar{max-width:940px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.hmark{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.htitle{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:19px;white-space:nowrap}
.hspace{flex:1}
.langtoggle{display:flex;background:#EFEFF4;border-radius:999px;padding:3px;flex:none}
.langtoggle button{padding:4px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted);transition:all .15s}
.langtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.headicon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none;transition:background .15s}
.headicon:hover{background:#EFEFF4}
.headicon svg{width:20px;height:20px}
.headicon .dot{position:absolute;top:1px;inset-inline-end:1px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.newsbtn{display:flex;align-items:center;gap:6px;padding:0 13px;height:38px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--gold-soft);color:var(--gold);flex:none;transition:filter .15s}
.newsbtn:hover{filter:brightness(.96)}
.newsbtn svg{width:16px;height:16px}
.avatarbtn{display:flex;align-items:center;gap:9px;padding:4px;padding-inline-end:13px;border-radius:999px;transition:background .15s;max-width:200px}
.avatarbtn:hover{background:#EFEFF4}
.avatarbtn .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:100px;height:100px;font-size:40px}
nav.tabs{max-width:940px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.navtab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:all .15s}
.navtab.on{background:var(--ink);color:#fff}
.navtab:not(.on):hover{background:#EFEFF4;color:var(--ink)}
main{max-width:940px;margin:0 auto;padding:26px 20px 160px}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h2{font-size:28px;font-weight:900}
.pagehead .sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.siman-list{display:flex;flex-direction:column;gap:12px}
.siman-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.siman-card:hover{border-color:#CBD6E5;box-shadow:var(--shadow)}
.siman-card.pinned{border:1.5px solid var(--blue);background:var(--blue-soft)}
.pin-divider{border-top:2px solid var(--line);margin:18px 4px}
.siman-med{width:52px;height:52px;flex:none;border-radius:15px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-size:23px;font-weight:700}
.siman-info{flex:1;min-width:0}
.siman-info .t{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18.5px}
.siman-info .m{color:var(--muted);font-size:13.5px;margin-top:2px}
.siman-arrow{color:#C6C6CE}
.siman-arrow svg{width:18px;height:18px}
html[dir=ltr] .siman-arrow{transform:scaleX(-1)}

.qnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;align-items:center}
.qnav::-webkit-scrollbar{display:none}
.qchip{min-width:42px;height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:'Frank Ruhl Libre',serif;font-size:16px;font-weight:700;color:var(--muted);flex:none;transition:all .15s;display:flex;align-items:center;justify-content:center}
.qchip:hover{border-color:var(--blue);color:var(--blue)}
.qchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qback{flex:none;font-size:14px;font-weight:600;color:var(--muted);padding:0 10px;height:38px;display:flex;align-items:center;gap:4px;border-radius:999px}
.qback:hover{background:#EFEFF4;color:var(--ink)}
.siman-head{margin-bottom:8px}
.siman-head .eyebrow{color:var(--gold);font-weight:700;font-size:14px}
.siman-head h2{font-size:32px;font-weight:900;line-height:1.2}
.saif-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.saif-chip{min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:'Frank Ruhl Libre',serif;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:all .15s}
.saif-chip:hover{border-color:var(--blue)}
.saif-chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(30,78,140,.28)}
.saif-chip.alt{font-family:'Assistant';font-size:14px;font-weight:700}
.saif-title-line{color:var(--muted);font-size:14.5px;min-height:22px;margin-bottom:14px}
.seg{display:flex;background:#EFEFF4;border-radius:15px;padding:4px;gap:4px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:all .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.09)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.mare-text{font-family:'Frank Ruhl Libre',serif;font-size:19px;line-height:2;white-space:pre-wrap}
.item-list{display:flex;flex-direction:column;gap:10px}
.item,.postcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.item .row{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.item .ic{width:44px;height:44px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--blue);background:var(--blue-soft)}
.item .ic svg{width:20px;height:20px}
.item .ic.red{background:var(--red-soft);color:var(--red)}
.item .ic.gold{background:var(--gold-soft);color:var(--gold)}
.item .body{flex:1;min-width:170px}
.item .t{font-weight:600;font-size:15.5px}
.item .m,.metaline{color:var(--muted);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.gray{background:#EFEFF4;color:var(--muted)}
.playbtn{width:46px;height:46px;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s, transform .1s}
.playbtn:hover{background:var(--blue-d)}
.playbtn:active{transform:scale(.95)}
.playbtn.playing{background:var(--gold)}
.playbtn svg{width:18px;height:18px}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty .e-ic{margin:0 auto 12px;width:40px;height:40px;color:#C6C6CE}
.empty .e-ic svg{width:40px;height:40px}
.empty .e-t{font-weight:600;color:var(--ink);margin-bottom:2px;font-size:16px}
.addrow{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.allsaif-block{margin-bottom:30px}
.allsaif-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.allsaif-head .med{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue);flex:none;display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-size:17px;font-weight:700}
.allsaif-head .t{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18px}
.subhead{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.simansec{margin-bottom:40px}
.simansec>.sh{display:flex;align-items:center;gap:12px;margin-bottom:16px;cursor:pointer}
.simansec>.sh h3{font-size:22px;font-weight:900}

.social{display:flex;gap:4px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #F1F1F4}
.socbtn{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;transition:all .12s}
.socbtn:hover{background:#F4F4F7;color:var(--ink)}
.socbtn.liked{color:var(--red)}
.socbtn svg{width:16px;height:16px}
.comment{padding:12px 0;border-bottom:1px solid #F1F1F4}
.comment:last-child{border-bottom:none}
.comment .ch{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment .cn{font-weight:700;font-size:14px}
.comment .cd{color:var(--muted);font-size:12px}
.comment .ct{font-size:14.5px;white-space:pre-wrap}
.comment .rep{margin-inline-start:26px;margin-top:10px;padding:10px 12px;background:#FAFAFC;border-radius:12px}
.compose{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.compose textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#FBFBFD;resize:vertical}
.compose .crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.exam-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.exam-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.exam-top .body{flex:1;min-width:200px}
.exam-top .t{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18px}
.exam-top .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.exam-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grade-big{font-family:'Frank Ruhl Libre',serif;font-size:30px;font-weight:900;color:var(--blue)}
.q-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px;background:#FBFBFD}
.q-card .qt{font-weight:700;margin-bottom:10px;font-size:15.5px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;transition:all .12s;font-size:15px}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt input{accent-color:var(--blue)}

.notes-toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;background:#FBFBFD;position:sticky;top:106px;z-index:5}
.ntb{min-width:34px;height:34px;padding:0 8px;border-radius:9px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .12s}
.ntb:hover{background:#EFEFF4}
.ntb u{text-decoration-thickness:2px}
.ntsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.colordot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none;transition:transform .12s}
.colordot:hover{transform:scale(1.15)}
.notes-editor{min-height:280px;border:1px solid var(--line);border-radius:0 0 16px 16px;padding:18px;background:#fff;line-height:1.85;font-size:16px}
.notes-editor:focus{outline:none;border-color:#C9D6E8}
.notes-editor:empty:before{content:attr(data-ph);color:#ABABB4}
.note-prev{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.note-prev:hover{border-color:#CBD6E5;box-shadow:var(--shadow)}
.note-prev .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.note-prev .body{color:var(--muted);font-size:14px;max-height:66px;overflow:hidden}

.profile-top{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px 24px;text-align:center}
.profile-top h2{font-size:26px;font-weight:900}
.photo-edit{position:relative;cursor:pointer}
.photo-edit .cam{position:absolute;bottom:0;inset-inline-end:0;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper)}
.photo-edit .cam svg{width:15px;height:15px}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:start;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid #F1F1F4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}

.overlay{position:fixed;inset:0;background:rgba(22,22,28,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:26px 24px 34px;transform:translateY(30px);transition:transform .22s}
.sheet.wide{max-width:940px}
.sheet.full{max-width:97vw;width:97vw;height:96vh;max-height:96vh}
.sheet.full .viewer-frame{height:calc(96vh - 190px)}
.sheet.full .viewer-img{max-height:calc(96vh - 190px)}
.overlay.open .sheet{transform:translateY(0)}
@media(min-width:700px){
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:24px;padding:30px}
  .overlay.open .sheet{transform:none}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
.sheet-head h3{font-size:21px;font-weight:900}
.xbtn{width:34px;height:34px;border-radius:50%;background:#EFEFF4;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.xbtn:hover{background:#E4E4EA;color:var(--ink)}
.xbtn svg{width:15px;height:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .chip{padding:8px 14px;min-width:42px;border-radius:999px;border:1px solid var(--line);background:#fff;font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:15px;transition:all .12s;text-align:center}
.chips .chip.txt{font-family:'Assistant';font-size:14px}
.chips .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.progress{height:8px;background:#EFEFF4;border-radius:99px;overflow:hidden;margin-top:14px;display:none}
.progress .bar{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .2s}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.viewer-frame{width:100%;height:72vh;border:none;border-radius:14px;background:#EFEFF4}
.viewer-img{width:100%;max-height:72vh;object-fit:contain;border-radius:14px;background:#EFEFF4}
.filerow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.filerow .fic{color:var(--blue);flex:none}
.filerow .fic svg{width:18px;height:18px}
.filerow .fn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .fs{color:var(--muted);font-size:12px;flex:none}

@keyframes flashbg{0%{background:var(--gold-soft)}100%{background:var(--card)}}
.flash{animation:flashbg 2.2s ease-out}

#player{position:fixed;bottom:0;left:0;right:0;z-index:80;transform:translateY(120%);transition:transform .25s}
#player.show{transform:translateY(0)}
.pl-inner{max-width:940px;margin:0 auto;padding:0 12px 12px}
.pl-card{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 -4px 30px rgba(28,28,34,.14);padding:12px 16px}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-info{flex:1;min-width:0}
.pl-info .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-info .m{font-size:12.5px;color:var(--muted)}
.pl-ctrl{display:flex;align-items:center;gap:4px}
.pl-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .15s;flex:none}
.pl-btn:hover{background:#EFEFF4}
.pl-btn.main{width:46px;height:46px;background:var(--blue);color:#fff}
.pl-btn.main:hover{background:var(--blue-d)}
.pl-btn svg{width:20px;height:20px}
.pl-speed{font-weight:700;font-size:13px;min-width:46px;height:32px;border-radius:999px;background:#EFEFF4;color:var(--ink);flex:none}
.pl-speed:hover{background:#E4E4EA}
.pl-clip{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;height:32px;padding:0 14px;border-radius:999px;background:var(--blue);color:#fff;flex:none}
.pl-clip:hover{background:var(--blue-d)}
#pl-marks{max-height:130px;overflow-y:auto;margin-top:6px}
#pl-marks:not(:empty){border-top:1px solid var(--line);padding-top:6px}
.pl-mark{display:flex;align-items:center;gap:10px;padding:4px 2px;font-size:14px}
.pl-mark .tm{flex:none;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pl-mark .tm:hover{background:#DCE7F5}
.pl-mark .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-mark .who{flex:none;font-size:12px;color:var(--muted)}
.pl-seek{display:flex;align-items:center;gap:10px;margin-top:8px}
.pl-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
input[type=range].seek{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:linear-gradient(to left, var(--blue) var(--fill,0%), #E4E4EA var(--fill,0%));cursor:pointer}
html[dir=ltr] input[type=range].seek{background:linear-gradient(to right, var(--blue) var(--fill,0%), #E4E4EA var(--fill,0%))}
input[type=range].seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range].seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--blue)}

#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.setup{max-width:600px;margin:50px auto;padding:0 20px}
.setup .panel{padding:30px}
.setup h2{font-size:24px;margin-bottom:10px}
.setup p{margin-bottom:8px;color:var(--muted)}
.setup code{background:#EFEFF4;padding:2px 7px;border-radius:6px;font-size:14px;direction:ltr;display:inline-block}
.spin{width:22px;height:22px;border:3px solid #DEDEE6;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-full{min-height:100vh;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:560px){
  .pagehead h2{font-size:24px}
  .siman-head h2{font-size:26px}
  main{padding:20px 14px 170px}
  .pl-btn{width:36px;height:36px}
  .avatarbtn .nm{display:none}
  .newsbtn span{display:none}
  .newsbtn{padding:0;width:38px;justify-content:center;border-radius:12px}
  .notes-toolbar{top:98px}
}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function gem(n){
  n = parseInt(n);
  if (!n || n < 1 || n > 999) return String(n);
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const hunds=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s = hunds[Math.floor(n/100)]; n %= 100;
  if (n === 15) return s + 'טו';
  if (n === 16) return s + 'טז';
  return (s + tens[Math.floor(n/10)] + ones[n%10]) || String(n);
}
function parseHebNum(str){
  str = String(str||'').trim().replace(/["'׳״\s.]/g,'');
  if (!str) return NaN;
  if (/^\d+$/.test(str)) return parseInt(str);
  const map = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400};
  let n = 0;
  for (const ch of str){ if (!(ch in map)) return NaN; n += map[ch]; }
  return n || NaN;
}
function saifLabel(saifim, simanId){
  if (!saifim || !saifim.length) return '';
  const mus = simanId ? isMusar(getSiman(simanId)) : false;
  const s = [...saifim].sort((a,b)=>a-b);
  const w = mus
    ? ({ he:['חלק ','חלקים '], es:['Sección ','Secciones '] }[LANG] || ['חלק ','חלקים '])
    : ({ he:['סעיף ','סעיפים '], es:['Saif ','Saifim '] }[LANG] || ['סעיף ','סעיפים ']);
  const g = mus ? (n => '<bdi>' + n + '</bdi>') : (n => '<bdi>' + gem(n) + '</bdi>');
  if (s.length === 1) return w[0] + g(s[0]);
  const contiguous = s.every((v,i)=> i===0 || v === s[i-1]+1);
  if (contiguous) return w[1] + g(s[0]) + '–' + g(s[s.length-1]);
  return w[1] + s.map(g).join(', ');
}
function fmtSize(b){ if(!b) return ''; if(b<1024*1024) return Math.round(b/1024)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fmtDate(ts){ try{ const d=new Date(ts); if(isNaN(d)) return ''; return d.toLocaleDateString(LANG==='he'?'he-IL':'es-MX',{day:'numeric',month:'short',year:'numeric'});}catch(e){return ''} }
function fmtDateFull(ts){ try{ const d=new Date(ts); if(isNaN(d)) return ''; return d.toLocaleDateString(LANG==='he'?'he-IL':'es-MX',{weekday:'long',day:'numeric',month:'short',year:'numeric'});}catch(e){return ''} }
function byLine(name, ts, word){
  if (!name && !ts) return '';
  return `${t(word||'byWord')} <b>${esc(name||'—')}</b> · ${fmtDateFull(ts)}`;
}
function fmtTime(sec){ if(!isFinite(sec)) return '0:00'; sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randSalt(){ return [...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join(''); }

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
  const p = h.split('/').filter(Boolean);
  PENDING_FOCUS = null;
  if (p[0] === 'siman' && p[1]){
    CUR.simanId = p[1];
    CUR.saif = p[2] !== undefined ? parseInt(p[2]) : 1;
    if (isNaN(CUR.saif)) CUR.saif = 1;
    CUR.tab = p[3] || (CUR.saif === 0 ? 'mare' : 'mare');
    show('siman'); return;
  }
  if (p[0] === 'mare' && p[1]){ CUR.simanId=p[1]; CUR.saif=parseInt(p[2]||'1')||1; CUR.tab='mare'; show('siman'); return; }
  if (p[0] === 'musar'){ show('musar'); return; }
  if (p[0] === 'todo'){ show('todoall'); return; }
  if (p[0] === 'importar'){ show('import'); return; }
  if (p[0] === 'micontenido'){ show('mycontent'); return; }
  if (p[0] === 'perfil'){ show('profile'); return; }
  if (p[0] === 'news'){ PENDING_FOCUS = p[1] ? 'it-' + p[1] : null; show('news'); return; }
  if (p[0] === 'qa'){ PENDING_FOCUS = p[1] ? 'it-' + p[1] : null; show('qa'); return; }
  if (p[0] === 'item' && p[1] && p[2]){ resolveItem(p[1], p[2]); return; }
  if (p[0] === 'add'){ openAddFromLink(p[1], p[2], p[3]); return; }
  show('home');
}

  if (view === 'import')    renderImport();
  if (view === 'mycontent') renderMyContent();

async function resolveItem(kind, id){
  const def = ITEM_TABLES[kind];
  if (!def) return show('home');
  try {
    const { data } = await sb.from(def[0]).select('*').eq('id', id).maybeSingle();
    if (!data){ toast(t('err') + '404'); return show('home'); }
    CUR.simanId = data.simanId;
    CUR.saif = (data.saifim && data.saifim[0]) || 1;
    CUR.tab = def[1];
    PENDING_FOCUS = 'it-' + id;
    window._pendingOpen = { kind, id };
    show('siman');
  } catch(e){ show('home'); }
}
function focusPending(){
  if (PENDING_FOCUS){
    const id = PENDING_FOCUS; PENDING_FOCUS = null;
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el){ el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('flash'); }
    }, 150);
  }
  const po = window._pendingOpen;
  if (po){
    window._pendingOpen = null;
    if (po.kind === 's') setTimeout(() => playShiur(po.id), 350);
    if (po.kind === 'm'){
      const k = Object.keys(VFILES).find(k => VFILES[k].id === po.id);
      if (k && isViewable(VFILES[k].fileName)) setTimeout(() => openViewerK(k), 350);

async function loadSocial(){
  const nodes = [...document.querySelectorAll('[data-soc]')];
  if (!nodes.length) return;
  const ids = [...new Set(nodes.map(n => n.dataset.soc.split('|')[1]))];
  try {
    const [{ data: likes }, { data: coms }] = await Promise.all([
      sb.from(T.likes).select('targetId,userId').in('targetId', ids),
      sb.from(T.comments).select('id,targetId,userId,visibility').in('targetId', ids)
    ]);
    nodes.forEach(n => {
      const [, id] = n.dataset.soc.split('|');
      const L = (likes||[]).filter(l => l.targetId === id);
      const C = (coms||[]).filter(c => c.targetId === id && canSeeComment(c));
      const likeBtn = n.querySelector('.like');
      const mine = L.some(l => l.userId === ME.id);
      likeBtn.classList.toggle('liked', mine);
      likeBtn.dataset.liked = mine ? '1' : '';
      likeBtn.querySelector('svg').style.fill = mine ? 'currentColor' : 'none';
      n.querySelector('.lc').textContent = L.length || '';
      n.querySelector('.cc').textContent = C.length || '';
    });
  } catch(e){}
}
function canSeeComment(c){
  if (c.visibility === 'public') return true;
  if (c.userId === ME.id) return true;
  if (c.visibility === 'admins' && isAdmin()) return true;
  return false;
}
async function likeToggle(btn, type, id){
  const liked = btn.dataset.liked === '1';
  const rowId = type + '|' + id + '|' + ME.id;
  btn.dataset.liked = liked ? '' : '1';
  btn.classList.toggle('liked', !liked);
  btn.querySelector('svg').style.fill = liked ? 'none' : 'currentColor';
  const lc = btn.querySelector('.lc');
  const cur = parseInt(lc.textContent) || 0;
  lc.textContent = (liked ? cur - 1 : cur + 1) || '';
  try {
    if (liked) await sb.from(T.likes).delete().eq('id', rowId);
    else await sb.from(T.likes).insert({ id: rowId, targetType: type, targetId: id, userId: ME.id });
  } catch(e){}
}

      </div>
      <div class="ct">${esc(c.text)}</div>
      <div style="display:flex;gap:4px;margin-top:6px;align-items:center">
        ${likeMini(c)}
        ${canReply(c) ? `<button class="socbtn" style="padding:3px 8px" onclick="replyBox('${c.id}')">${icon('chat')}<span>${t('reply')}</span></button>` : ''}
      </div>
      <div id="rb-${c.id}"></div>
      ${kidsOf(c.id).map(r => `
        <div class="rep">
          <div class="ch"><span class="cn">${esc(r.userName)}</span><span class="cd">${fmtDate(r.createdAt)}</span>
            <div style="flex:1"></div>
            ${(r.userId===ME.id || isAdmin()) ? `<button class="iconbtn" style="width:26px;height:26px" onclick="delComment('${r.id}','${type}','${id}','${ownerId||''}')">${icon('trash',13)}</button>` : ''}
          </div>
          <div class="ct">${esc(r.text)}</div>
          <div style="margin-top:5px">${likeMini(r)}</div>
        </div>`).join('')}
    </div>`).join('') : `<div class="empty" style="padding:24px"><div class="e-t">${t('noComments')}</div></div>`;

  const canRoot = mode !== 'qa' || isAdmin();
  const compose = canRoot ? `
    <div class="compose">
      <textarea id="cm-text" rows="3" placeholder="${mode==='qa' ? t('answerBtn')+'…' : t('commentPh')}"></textarea>
      <div class="crow">
        ${mode==='content' ? `<select id="cm-vis" style="padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff">

        </select>` : ''}

      </div>
    </div>` : `<div class="hint" style="text-align:center;margin-top:14px">${t('qaOnlyAdmins')}</div>`;

  openSheet(`${sheetHead(t('commentsT'))}<div>${rootsHTML}</div>${compose}`);

async function sendComment(type, id, parentId, ownerId){

function renderSetup(err){

function renderAuth(mode='login'){
  window._authMode = mode;
  const isReg = mode === 'register';
  app.innerHTML = `
  <div class="auth-wrap"><div class="auth-card">
    <div class="auth-lang">${langToggleHTML()}</div>
    <div class="auth-mark">${icon('book',34)}</div>
    <h1>${esc(APP_NAME)}</h1>
    <div class="auth-sub">${t('authSub')}</div>
    <div class="auth-err" id="a-err"></div>
    <div class="field"><label>${t('fullName')}</label>
      <input id="a-name" autocomplete="username" placeholder="${t('namePh')}"></div>
    <div class="field"><label>${t('password')}</label>
      <input id="a-pass" type="password" autocomplete="${isReg?'new-password':'current-password'}" placeholder="••••••"></div>
    ${isReg ? `<div class="field"><label>${t('password2')}</label>
      <input id="a-pass2" type="password" autocomplete="new-password" placeholder="••••••"></div>` : ''}
    <button class="btn full" id="a-go" style="margin-top:6px">${isReg?t('register'):t('login')}</button>
    <div class="auth-switch">${isReg
      ? `${t('haveAccount')} <button onclick="renderAuth('login')">${t('login')}</button>`
      : `${t('newHere')} <button onclick="renderAuth('register')">${t('registerLink')}</button>`}</div>
  </div></div>`;
  const submit = () => isReg ? doRegister() : doLogin();
  $('a-go').onclick = submit;
  app.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key==='Enter') submit(); }));
  $('a-name').focus();
}
function authErr(msg){ const e=$('a-err'); e.textContent=msg; e.style.display='block'; }
const userId = name => name.trim().replace(/\s+/g,' ').toLowerCase();
async function doRegister(){
  const name = $('a-name').value.trim().replace(/\s+/g,' ');
  const p1 = $('a-pass').value, p2 = $('a-pass2').value;
  if (name.length < 2) return authErr(t('errName'));
  if (p1.length < 4)   return authErr(t('errPass4'));
  if (p1 !== p2)       return authErr(t('errPassMatch'));
  const btn = $('a-go'); btn.disabled = true; btn.textContent = t('wait');
  try {
    const id = userId(name);
    const { data: exist, error: e1 } = await sb.from(T.users).select('id').eq('id', id).maybeSingle();
    fail(e1);
    if (exist){ authErr(t('errUserExists')); btn.disabled=false; btn.textContent=t('register'); return; }
    const { count, error: e2 } = await sb.from(T.users).select('id', { count:'exact', head:true });
    fail(e2);
    const first = !count;
    const salt = randSalt();
    const hash = await sha256(salt + p1);
    const { error: e3 } = await sb.from(T.users).insert({ id, name, salt, hash, role: first ? 'admin' : 'member' });
    fail(e3);
    ME = { id, name, role: first ? 'admin' : 'member', photo: null };
    saveSession();
    toast(first ? t('welcomeFirst') : t('welcome'));
    await loadSimanim(); await catAutoSeed(); renderApp(); arcAutoImport();
  } catch(e){ authErr(t('err') + e.message); btn.disabled=false; btn.textContent=t('register'); }
}
async function doLogin(){
  const name = $('a-name').value.trim();
  const pass = $('a-pass').value;
  if (!name || !pass) return authErr(t('errFill'));
  const btn = $('a-go'); btn.disabled = true; btn.textContent = t('wait');
  try {
    const { data: u, error } = await sb.from(T.users).select('*').eq('id', userId(name)).maybeSingle();
    fail(error);
    if (!u){ authErr(t('errUserNotFound')); btn.disabled=false; btn.textContent=t('login'); return; }
    const hash = await sha256(u.salt + pass);
    if (hash !== u.hash){ authErr(t('errWrongPass')); btn.disabled=false; btn.textContent=t('login'); return; }
    ME = { id: u.id, name: u.name, role: u.role, photo: u.photo };
    saveSession();
    await loadSimanim(); await catAutoSeed(); renderApp(); arcAutoImport();
  } catch(e){ authErr(t('err') + e.message); btn.disabled=false; btn.textContent=t('login'); }
}
function logout(){ ME = null; clearSession(); closePlayer(); location.hash=''; renderAuth(); }

let ADMINS = null;
async function getAdmins(){
  if (ADMINS) return ADMINS;
  const { data } = await sb.from(T.users).select('id,name').eq('role','admin');
  ADMINS = { ids: new Set((data||[]).map(u=>u.id)), names: new Set((data||[]).map(u=>u.name)) };
  return ADMINS;
}
async function fetchRecent(){
  const adm = await getAdmins();
  const q = tbl => sb.from(tbl).select('*').order('createdAt', { ascending:false }).limit(12).then(r => r.data || []);
  const [mats, shs, exs, nws, cps, qsAll, myQs, ans] = await Promise.all([
    q(T.materials), q(T.shiurim), q(T.exams), q(T.news), q(T.shared),
    isAdmin() ? q(T.questions) : Promise.resolve([]),
    sb.from(T.questions).select('id,text').eq('userId', ME.id).then(r => r.data || []),
    sb.from(T.comments).select('*').eq('targetType','question').order('createdAt', { ascending:false }).limit(20).then(r => r.data || [])
  ]);
  const myQ = new Map(myQs.map(x => [x.id, x]));
  const merged = [];
  mats.filter(x => adm.names.has(x.uploadedBy)).forEach(x => merged.push({ ...x, _kind:'material', _icon:'file' }));
  shs.filter(x => adm.names.has(x.uploadedBy)).forEach(x => merged.push({ ...x, _kind:'shiur', _icon:'audio' }));
  exs.filter(x => adm.names.has(x.createdBy)).forEach(x => merged.push({ ...x, _kind:'exam', _icon:'exam' }));
  nws.forEach(x => merged.push({ ...x, _kind:'news', _icon:'mega' }));
  cps.filter(x => adm.ids.has(x.userId)).forEach(x => merged.push({ ...x, _kind:'shared', _icon:'users' }));
  qsAll.filter(x => x.userId !== ME.id).forEach(x => merged.push({ ...x, _kind:'question', _icon:'qa' }));
  ans.filter(c => myQ.has(c.targetId) && c.userId !== ME.id && !c.parentId)
     .forEach(c => merged.push({ ...c, _kind:'answer', _icon:'send', _qtext: (myQ.get(c.targetId)||{}).text }));
  merged.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  return merged.slice(0, 30);
}
function notifTitle(n){
  if (n._kind === 'answer') return t('answeredYou');
  if (n._kind === 'question') return (n.text || '').slice(0, 70);
  return n.title || t('newContent');
}
function notifMeta(n){
  const sm = n.simanId ? getSiman(n.simanId) : null;
  const parts = [];
  if (n._kind === 'material') parts.push(t('tabContent'));
  if (n._kind === 'shiur')    parts.push(t('tabShiurim'));
  if (n._kind === 'exam')     parts.push(t('tabExams'));
  if (n._kind === 'shared')   parts.push(t('tabShared'));
  if (n._kind === 'news')     parts.push('News');
  if (n._kind === 'question') parts.push(t('qaT'));
  if (n._kind === 'answer')   parts.push('«' + esc((n._qtext || '').slice(0, 45)) + '…»');
  if (sm) parts.push(t('siman') + ' <bdi>' + gem(sm.number) + '</bdi>' + (n.saifim && n.saifim.length ? ' · ' + saifLabel(n.saifim) : (n.saif ? ' · ' + t('saif') + ' <bdi>' + gem(n.saif) + '</bdi>' : '')));
  const by = n.uploadedBy || n.createdBy || n.userName;
  if (by) parts.push(esc(by));
  parts.push(fmtDate(n.createdAt));
  return parts.filter(Boolean).join(' · ');
}
function notifLink(n){
  if (n._kind === 'material') return linkOf.material(n);
  if (n._kind === 'shiur')    return linkOf.shiur(n);
  if (n._kind === 'exam')     return linkOf.exam(n);
  if (n._kind === 'shared')   return linkOf.shared(n);
  if (n._kind === 'news')     return linkOf.news(n);
  if (n._kind === 'question') return linkOf.question(n);
  if (n._kind === 'answer')   return '/qa/' + n.targetId;
  return '/';
}
async function notifBadge(){
  try {
    const seen = new Date(localStorage.getItem('jh_seen') || '2000-01-01');
    const items = await fetchRecent();
    const cnt = items.filter(n => new Date(n.createdAt) > seen).length;
    const dot = $('bell-dot');
    if (dot){ dot.style.display = cnt ? 'flex' : 'none'; dot.textContent = cnt > 9 ? '9+' : cnt; }
  } catch(e){}
}
async function openNotif(){
  openSheet(`${sheetHead(t('notifT'))}<div style="padding:30px"><div class="spin"></div></div>`);
  const items = await fetchRecent();
  const seen = new Date(localStorage.getItem('jh_seen') || '2000-01-01');
  localStorage.setItem('jh_seen', new Date().toISOString());
  const dot = $('bell-dot'); if (dot) dot.style.display = 'none';
  openSheet(`${sheetHead(t('notifT'))}
    ${items.length ? `<div class="item-list">` + items.map(n => `
      <div class="item" style="cursor:pointer" onclick="closeSheet();nav('${notifLink(n)}')">
        <div class="row">
          <div class="ic ${new Date(n.createdAt) > seen ? 'gold' : ''}">${icon(n._icon)}</div>
          <div class="body">
            <div class="t">${esc(notifTitle(n))}</div>
            <div class="m">${notifMeta(n)}</div>
          </div>
          ${new Date(n.createdAt) > seen ? `<span class="badge gold">${t('newContent')}</span>` : ''}
        </div>
      </div>`).join('') + `</div>`
    : `<div class="empty"><div class="e-ic">${icon('bell',40)}</div><div class="e-t">${t('notifEmpty')}</div></div>`}`);
}

/* ═══════════ Importación de módulos (solo admin) ═══════════ */
function catNorm(s){
  return String(s || '').toLowerCase()
    .replace(/\.[a-z0-9]{2,4}$/, '')
    .replace(/[\u0591-\u05BD\u05BF-\u05C7]/g, '') /* nikud y טעמים, pero NO el maqaf U+05BE */
    .replace(/[׳״'"]/g, '')                 /* geresh/gershayim van DENTRO del número: ש״ו → שו */
    .replace(/[`.\-_·־–—\[\]()]/g, ' ')      /* el maqaf ־ sí separa: ש״ו־שט״ז → שו שטז */
    .replace(/\s+/g, ' ').trim();
}
/* Título de un archivo que no figura en el catálogo: sin extensión y sin el
   número de orden que le pone el robot ("03 …", "3.", "[3]", "3-") */
function catTituloLibre(name){
  return String(name || '').replace(/\.[^.]+$/, '')
    .replace(/^\s*\[?\d{1,3}\]?[.\-_\s]*/, '')
    .replace(/\s+/g, ' ').trim() || String(name || '');
}
/* Carpeta nueva que no está en el catálogo pero nombra su siman
   ("סימן שמא", "סימן שמ״ב מכה בפטיש", "341 …"): devuelve el número o 0 */
function catSimanDeCarpeta(dirs){
  for (let d = dirs.length - 1; d >= 0; d--){
    const m = String(dirs[d]).trim().match(/^(?:סימן|סי׳|סי'|siman)?\s*([\u05D0-\u05EA״׳"']{1,5}|\d{1,3})(?=\s|$)/);
    if (!m) continue;
    const n = parseHebNum(m[1]);
    if (n >= 242 && n <= 365) return n;
  }
  return 0;
}
/* El siman por número; si no existe lo crea con el título y los סעיפים del ש״ע */
async function catEnsureSiman(num){
  let s = SIMANIM.find(x => x.number === num && !isMusar(x));
  if (s) return s;
  const sa = SA_MAP[num];
  const { data, error } = await sb.from(T.simanim)
    .insert({ number: num, title: sa ? sa.title : 'סימן ' + gem(num), saifim: catSaifimDe(num, 1), kind: 'halaja' })
    .select().single();
  fail(error);
  await loadSimanim();
  return data;
}
/* Une el módulo del catálogo con el siman ya creado en la base */
function catSiman(mod){
  if (mod.musar) return SIMANIM.find(s => (s.title || '').trim() === mod.folder) || null;
  return SIMANIM.find(s => s.number === mod.siman && !isMusar(s)) || null;
}
/* Nº de saif (1..N) al que corresponde un archivo, o 0 si no hay match */
function catMatchFile(fileName, items){
  const f = catNorm(fileName);
  const lead = f.match(/^(\d{1,3})\b/);
  if (lead){
    const n = parseInt(lead[1], 10);
    if (n >= 1 && n <= items.length) return n;
    /* Numerado más allá del catálogo: es un shiur nuevo (lo puso el robot de
       WhatsApp), conserva su propio nombre en vez de parecerse a otro */
    if (n > items.length) return 0;
  }
  const bracket = f.match(/\[(\d{1,3})\]/);
  if (bracket){
    const n = parseInt(bracket[1], 10);
    if (n >= 1 && n <= items.length) return n;
  }
  /* Número al final del nombre ("… טעם הלימוד 3", "חשיבות הכתיבה -2") */
  const tail = f.match(/(\d{1,3})\s*$/);
  const tailN = tail ? parseInt(tail[1], 10) : 0;
  let best = 0, bestScore = 0, bestBonus = 0, bestSpec = 0;
  items.forEach((it, i) => {
    const toks = catNorm(it).split(' ').filter(w => w.length > 2);
    if (!toks.length) return;
    const hits = toks.filter(w => f.includes(w));
    const score = hits.length / toks.length;          /* cuánto del título aparece */
    const lastTok = toks.length ? catNorm(it).split(' ').pop() : '';
    const hebN = parseHebNum(lastTok);                /* letra hebrea final: … שבת ה */
    const bonus = (tailN === i + 1 ||
                   (hebN === i + 1 && f.split(' ').includes(lastTok))) ? 1 : 0;
    const spec  = hits.join('').length;               /* desempate por especificidad */
    if (score > bestScore ||
       (score === bestScore && bonus > bestBonus) ||
       (score === bestScore && bonus === bestBonus && spec > bestSpec)){
      bestScore = score; bestBonus = bonus; bestSpec = spec; best = i + 1;
    }
  });
  return bestScore >= 0.5 ? best : 0;
}

/* ═══════════ Importar desde archive.org ═══════════
   El audio vive en archive.org y la app solo guarda el enlace: no pasa por
   Supabase Storage, así que no hay límite de tamaño ni de cuota. */
function arcId(v){
  v = String(v || '').trim();
  const m = v.match(/archive\.org\/(?:details|download|metadata|embed)\/([^\/?#]+)/i);
  return m ? decodeURIComponent(m[1]) : v.replace(/^\/+|\/+$/g, '');
}
const arcUrl = (id, name) =>
  'https://archive.org/download/' + encodeURIComponent(id) + '/' +
  String(name).split('/').map(encodeURIComponent).join('/');

async function arcOpen(){
  const id = await catArcIdConocido();

    <div class="field"><label>${t('arcIdL')}</label>
      <input id="arc-id" value="${esc(id)}" placeholder="${t('arcIdPh')}"></div>
    <div class="hint" style="margin:-6px 0 14px">${t('arcHint')}</div>
    <button class="btn full soft" id="arc-load" onclick="arcLoad()">${t('arcLoadBtn')}</button>
    <div id="arc-sum" style="margin-top:14px"></div>
    <div class="hint" id="arc-msg"></div>`, true);
  setTimeout(() => { const e = $('arc-id'); if (e) e.focus(); }, 100);

/* Lee el ítem en archive.org y devuelve el plan de reparto de sus archivos */
async function arcFetchPlan(id){
  const r = await fetch('https://archive.org/metadata/' + encodeURIComponent(id));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const meta = await r.json();
  if (!meta || !meta.files || !meta.files.length) throw new Error(t('arcNotFound'));
  /* Solo los archivos que subió el usuario: archive.org agrega derivados y metadatos */
  const files = meta.files
    .filter(f => f.source === 'original' && !/^_|_(files|meta|reviews)\.xml$|\.torrent$|^__ia_thumb/.test(f.name))
    .map(f => ({ name: String(f.name).split('/').pop(), webkitRelativePath: f.name,
                 size: parseInt(f.size || 0, 10) || 0, _arc: arcUrl(id, f.name) }));
  if (!files.length) throw new Error(t('arcNotFound'));
  return catPlan(files);
}

    <button class="btn full" id="arc-go" onclick="arcImport()">${t('arcGo')}</button>`;

/* Importa un plan (de arcFetchPlan): crea lo que falte y agrega solo lo nuevo.
   Con silent no toca la pantalla: lo usa la importación automática. */
async function arcImportPlan(plan, silent){
  plan = (plan || []).filter(p => p.mi >= 0 || p.siman || (p.sefer && p.sefer.ii));
  let ok = 0, dup = 0;
  if (!plan.length) return { ok, dup };
  const [shs, mts] = await Promise.all([
    sb.from(T.shiurim).select('simanId,fileName'),
    sb.from(T.materials).select('simanId,fileName')
  ]);
  const seen = new Set([...(shs.data||[]), ...(mts.data||[])].map(r => r.simanId + '|' + r.fileName));
  /* Solo se crean módulos si traen algo nuevo: así la importación automática
     no rearma un módulo que se borró a propósito */
  const nuevos = plan.filter(p => {
    if (p.sefer) return true;
    const s = p.mi >= 0 ? catSiman(CATALOG[p.mi]) : SIMANIM.find(x => x.number === p.siman && !isMusar(x));
    return !s || !seen.has(s.id + '|' + p.f.name);
  });
  if (!nuevos.length) return { ok, dup: plan.length };
  for (const mi of [...new Set(nuevos.filter(p => p.mi >= 0).map(p => p.mi))]){
    if (!catSiman(CATALOG[mi])) await catCreateModule(mi, true);
  }
  /* Los sefarim van al final: así alcanzan también a los simanim recién creados */
  const orden = [...plan.filter(p => !p.sefer), ...plan.filter(p => p.sefer)];
  for (const { f, mi, kind, n, sefer, siman } of orden){
    if (sefer){
      /* Un sefer no tiene módulo propio: se referencia en cada siman de su rango */
      const titulo = CAT_SEFARIM[sefer.gi].items[sefer.ii - 1].t;
      ok += await catSpreadSefer(titulo, { url: f._arc, fileName: f.name, size: f.size }, seen, silent);
      continue;
    }
    const mod = mi >= 0 ? CATALOG[mi] : null;
    const s = mod ? catSiman(mod) : await catEnsureSiman(siman);
    if (!s) continue;
    if (seen.has(s.id + '|' + f.name)){ dup++; continue; }
    const tbl = kind === 'shiur' ? T.shiurim : T.materials;
    const title = n ? mod.items[n-1] : catTituloLibre(f.name);
    /* Sin storagePath: el archivo no es nuestro, vive en archive.org */
    const meta = { url: f._arc, fileName: f.name, size: f.size };
    const { error } = await sb.from(tbl).insert({
      simanId: s.id, saifim: catSaifDeShiur(title), title, ...meta, uploadedBy: ME.name
    });
    fail(error);
    seen.add(s.id + '|' + f.name);
    ok++;
    if (tbl === T.materials) ok += await catSpreadSefer(title, meta, seen, silent);
  }
  return { ok, dup };
}
async function arcImport(){
  const plan = (window._arcPlan || []).filter(p => p.mi >= 0 || p.siman || (p.sefer && p.sefer.ii));
  if (!plan.length) return toast(t('catNoFile'));
  const btn = $('arc-go'); if (btn){ btn.disabled = true; btn.textContent = t('wait'); }
  try {
    const { ok, dup } = await arcImportPlan(plan);
    if (window._arcId) localStorage.setItem('jh_arc_id', window._arcId);
    closeSheet();
    toast(ok + ' ' + t('catUploaded') + (dup ? ' · ' + dup + ' ' + t('catDirDup') : ''));
    show(CUR.view); notifBadge();

async function arcAutoImport(){

  try { sessionStorage.setItem('jh_arc_auto', String(Date.now())); } catch(e){}
  const id = await catArcIdConocido();
  if (!id) return;

let SPOTIFY_EPS = null;

async function spotifyCargar(){

function spotifyNumFinal(s){
  const m = catNorm(s).match(/(?:^|\s)(\d{1,3}|[\u05D0-\u05EA]{1,2})$/);
  if (!m) return 0;
  const n = parseHebNum(m[1]);

}
/* Cuánto del título a aparece en b: 1 = todas sus palabras */
function spotifyPuntaje(a, b){
  const toks = catNorm(a).split(' ').filter(w => w.length > 2);
  if (!toks.length) return 0;
  const nb = ' ' + catNorm(b) + ' ';
  return toks.filter(w => nb.includes(' ' + w + ' ')).length / toks.length;
}
function spotifyMejor(t, nombres){
  const nt = spotifyNumFinal(t);
  let best = -1, bestScore = 0;
  nombres.forEach((n, i) => {
    const nn = spotifyNumFinal(n);
    if (nt && nn && nt !== nn) return;          /* "שיעור ב" no es "שיעור 3" */
    const sc = spotifyPuntaje(t, n);
    if (sc > bestScore){ bestScore = sc; best = i; }

function spotifyDe(t){

    if (SPOTIFY_HIT[t] === undefined){
      const k = catNorm(t);
      let ep = SPOTIFY_EPS.find(e => catNorm(e.nombre) === k);
      if (!ep){

const SAIF_NUM = '[א-ת]{1,4}(?:״|׳|")?[א-ת]?';
function catSaifDe(titulo){
  const t = String(titulo || '').replace(/[•·]/g, ' ');
  const rango = t.match(new RegExp('סעי(?:ף|פים)\\s+(' + SAIF_NUM + ')\\s*עד\\s*(?:סעיף\\s+)?(' + SAIF_NUM + ')'));

    const a = parseHebNum(rango[1]), b = parseHebNum(rango[2]);
    if (a && b && a <= b && b <= 60)
      return Array.from({length: b - a + 1}, (_, i) => a + i);
  }
  const re = new RegExp('סעי(?:ף|פים)\\s+(' + SAIF_NUM + '(?:\\s*[-־–]\\s*' + SAIF_NUM + ')*)', 'g');
  let m, out = [];
  while ((m = re.exec(t))){
    m[1].split(/[-־–]/).forEach(p => { const n = parseHebNum(p); if (n && n <= 60) out.push(n); });
  }
  if (out.length === 2 && out[1] - out[0] > 2)
    out = Array.from({length: out[1] - out[0] + 1}, (_, i) => out[0] + i);
  return [...new Set(out)].sort((a, b) => a - b);

/* Un shiur de הקדמה, סיכום o חזרה no habla de un saif concreto */
const catEsIntro = t => /הקדמה|פתיחה|סיכום|חזרה|חזרות|כללים|יסודות|הגדרה|הגדרים/.test(String(t || ''));
/* Dónde va un shiur: su saif si lo dice, y si no el primero del siman */
/* Primero lo que dice el propio nombre; después el catálogo del ש״ע; si no,
   el primer saif (es un shiur de הקדמה, סיכום o חזרה). */
function catSaifDeShiur(titulo){
  const delNombre = catSaifDe(titulo);
  if (delNombre.length) return delNombre;
  return CAT_SAIF[titulo] || [1];
}

/* Los saifim reales del siman, según el שולחן ערוך */
function catSaifimDe(num, cuantos){
  const sa = SA_MAP[num];
  const n = (sa && sa.saifim) || cuantos || 1;
  return Array.from({length: n}, (_, i) => ({ n: i + 1, title: '' }));
}
async function catAbrirJelek(){
  const btn = $('jel-go'); if (btn){ btn.disabled = true; btn.textContent = t('wait'); }
  const msg = $('jel-msg');
  let creados = 0, actualizados = 0;
  try {
    for (const [num, titulo, cuantos] of SA_SHABAT){
      const ya = SIMANIM.find(s => s.number === num && !isMusar(s));
      if (ya){
        /* Ya existe (vino del catálogo): se le pone el título del ש״ע y se
           completan los saifim que le falten, sin tocar lo que tiene adentro. */
        const saifim = (ya.saifim || []).slice();
        while (saifim.length < cuantos) saifim.push({ n: saifim.length + 1, title: '' });
        const { error } = await sb.from(T.simanim)
          .update({ title: titulo, saifim }).eq('id', ya.id);
        fail(error);
        actualizados++;
      } else {
        const { error } = await sb.from(T.simanim)
          .insert({ number: num, title: titulo, saifim: catSaifimDe(num, cuantos), kind: 'halaja' });
        fail(error);
        creados++;
      }
      if (msg) msg.textContent = (creados + actualizados) + ' / ' + SA_SHABAT.length;
    }
    await loadSimanim();
    closeSheet();
    toast(creados + ' ' + t('jelNuevos') + ' · ' + actualizados + ' ' + t('jelActualizados'));
    show(CUR.view);
  } catch(e){
    if (msg) msg.textContent = t('err') + e.message;
    if (btn){ btn.disabled = false; btn.textContent = t('jelGo'); }
  }
}
function catOpenJelek(){
  const faltan = SA_SHABAT.filter(([n]) => !SIMANIM.some(s => s.number === n && !isMusar(s))).length;
  openSheet(`${sheetHead(t('jelT'))}

}

/* ═══════════ Reordenar lo ya importado ═══════════
   La primera importación creó como simanim cosas que no lo son (los ספרים) y
   dejó las sijot de מוסר fuera de su pestaña. Esto borra lo que vino del
   catálogo y lo vuelve a armar bien; el audio no se toca, vive en archive.org. */
const CAT_LEGACY = [
  'לש', 'טוחן', 'מלאכת מעבד', 'גוזז', 'כותב ומוחק',
  'ספרים · טור ושולחן ערוך', 'ספרים · משנה ברורה מתיבתא', 'ספרים · כף החיים',
  'ספרים · חזון עובדיה', 'ספרים · מנוחת אהבה', 'ספרים · אגרות משה',
  'ספרים · שלמי יהונתן', 'ספרים · שולחן מבואר'
];
function catDelCatalogo(){
  const titulos = new Set([...CATALOG.map(m => m.folder), ...CAT_LEGACY]);
  return SIMANIM.filter(s => titulos.has((s.title || '').trim()));
}
/* El identificador se recuerda en el navegador, pero si se importó desde otro
   equipo se deduce de la URL de cualquier shiur ya cargado. */
async function catArcIdConocido(){
  try { const g = localStorage.getItem('jh_arc_id'); if (g) return g; } catch(e){}
  try {
    const { data } = await sb.from(T.shiurim).select('url').limit(50);
    const fila = (data || []).find(x => /archive\.org\/download\//.test(x.url || ''));
    if (fila) return decodeURIComponent(fila.url.split('/download/')[1].split('/')[0]);
  } catch(e){}
  return '';
}
async function catOpenReorder(){
  const viejos = catDelCatalogo();
  const id = await catArcIdConocido();
  openSheet(`${sheetHead(t('reoT'))}
    <div class="hint" style="margin-bottom:14px">${t('reoWhat')}</div>
    <div class="field"><label>${t('arcIdL')}</label>
      <input id="reo-id" value="${esc(id)}" placeholder="${t('arcIdPh')}"></div>
    <div class="hint" style="margin:-6px 0 14px">${viejos.length} ${t('reoCount')}</div>
    <button class="btn full" id="reo-go" onclick="catReorder()">${t('reoGo')}</button>
    <div class="hint" id="reo-msg" style="margin-top:10px"></div>`);
}
async function catReorder(){
  const id = arcId(($('reo-id') || {}).value);
  if (!id) return toast(t('arcNeedId'));
  const btn = $('reo-go'); btn.disabled = true; btn.textContent = t('wait');
  const msg = $('reo-msg');
  try {
    /* Primero se lee el ítem: si falla, no se borra nada */
    msg.textContent = t('reoReading');
    const plan = await arcFetchPlan(id);
    msg.textContent = t('reoCleaning');
    for (const s of catDelCatalogo()){
      const { data: shs } = await sb.from(T.shiurim).select('id').eq('simanId', s.id);
      for (const x of (shs || [])){ try { await sb.from(T.marks).delete().eq('shiurId', x.id); } catch(e){} }
      await sb.from(T.shiurim).delete().eq('simanId', s.id);
      await sb.from(T.materials).delete().eq('simanId', s.id);
      const { error } = await sb.from(T.simanim).delete().eq('id', s.id);
      fail(error);
    }
    await loadSimanim();
    msg.textContent = t('reoImporting');
    window._arcId = id; window._arcPlan = plan;
    await arcImport();
    localStorage.setItem('jh_arc_id', id);
  } catch(e){
    msg.textContent = t('err') + e.message;
    btn.disabled = false; btn.textContent = t('reoGo');
  }
}

const CAT_RANGES = {};
/* Los que nombran los simanim que abarcan: van a cada uno de ellos */
const CAT_PRECISO = new Set();
CAT_SEFARIM.forEach(g => g.items.forEach(x => {
  CAT_RANGES[x.t] = x.r;
  if (x.p) CAT_PRECISO.add(x.t);

/* Deja el sefer en el contenido de cada módulo de shiurim que su rango abarca.
   Sube el archivo una sola vez: acá solo se agregan las referencias. */
async function catSpreadSefer(title, meta, seen, soloExistentes){
  const rng = CAT_RANGES[title];
  if (!rng) return 0;
  let n = 0;
  /* Un sefer que declara simanim en su nombre (מ״ב, כף החיים, שלמי יהונתן,
     ש״ע) va a TODOS los simanim de su rango. Los generales, que valen para
     toda הלכות שבת, solo a los que tienen shiurim: si no, saturan los 93. */
  let destinos;
  if (CAT_PRECISO.has(title)){
    destinos = SIMANIM.filter(s => !isMusar(s) && s.number >= rng[0] && s.number <= rng[1]);
  } else {
    destinos = [];
    for (let i = 0; i < CATALOG.length; i++){
      const mod = CATALOG[i];
      if (mod.musar || mod.siman < rng[0] || mod.siman > rng[1]) continue;
      let sm = catSiman(mod);
      if (!sm && !soloExistentes) sm = await catCreateModule(i, true);
      if (sm) destinos.push(sm);
    }
  }
  for (const s of destinos){
    if (seen.has(s.id + '|' + meta.fileName) || seen.has(s.id + '|' + title)) continue;
    const { error } = await sb.from(T.materials).insert({
      simanId: s.id, saifim: (s.saifim || []).map(x => x.n), title, ...meta, uploadedBy: ME.name
    });
    fail(error);
    seen.add(s.id + '|' + meta.fileName); seen.add(s.id + '|' + title);
    n++;
  }
  return n;
}

const CAT_AV = /\.(mp3|m4a|aac|wav|ogg|opus|amr|aif|aiff|caf|wma|mp4|m4v|mov|3gp)$/i;
/* Nombre real de la carpeta en el Drive (por defecto, el del módulo) */
const catDirsOf = mod => mod.dirs || (mod.groups && mod.groups.map(g => g[0])) || [mod.dir || mod.folder];
/* Encuentra el módulo mirando las carpetas de la ruta, de la más profunda a la más
   superficial: así "…/שיחות מוסר/שאול לניאדו/x.m4a" cae en שאול לניאדו y no en el padre */
function catRouteFile(f){
  const rel = f.webkitRelativePath || f.name;
  const dirs = rel.split('/').slice(0, -1);
  for (let d = dirs.length - 1; d >= 0; d--){
    const key = catNorm(dirs[d]);
    const i = CATALOG.findIndex(mod => catDirsOf(mod).some(d => catNorm(d) === key));
    if (i >= 0) return i;
  }
  return -1;
}
/* Un archivo bajo ספרים/… se resuelve contra el sefer al que pertenece */
function catRouteSefer(f){
  const dirs = (f.webkitRelativePath || f.name).split('/').slice(0, -1);
  for (let d = dirs.length - 1; d >= 0; d--){
    const key = catNorm(dirs[d]);
    const gi = CAT_SEFARIM.findIndex(g => catNorm(g.dir) === key);
    if (gi < 0) continue;
    const ii = catMatchFile(f.name, CAT_SEFARIM[gi].items.map(x => x.t));
    return { gi, ii };
  }
  return null;
}
/* Un módulo armado con varias carpetas (el שכ״א sale de מעבד, טוחן y לש) numera
   sus archivos desde 1 en cada una, así que hay que buscar solo dentro del
   tramo que le toca a la carpeta del archivo. */
function catTramo(mod, f){
  if (!mod.groups) return { items: mod.items, off: 0 };
  const dirs = (f.webkitRelativePath || f.name).split('/').slice(0, -1).map(catNorm);
  let off = 0;
  for (const [dir, cant] of mod.groups){
    if (dirs.includes(catNorm(dir))) return { items: mod.items.slice(off, off + cant), off };
    off += cant;
  }
  return { items: mod.items, off: 0 };
}
function catPlan(files){
  return files.map(f => {
    const mi = catRouteFile(f);
    if (mi < 0){
      const sef = catRouteSefer(f);
      if (sef) return { f, mi:-1, sefer:sef, kind:'material' };
      const num = catSimanDeCarpeta((f.webkitRelativePath || f.name).split('/').slice(0, -1));
      if (num) return { f, mi:-1, siman:num, kind: CAT_AV.test(f.name) ? 'shiur' : 'material', n:0 };
      return { f, mi:-1 };
    }
    const mod = CATALOG[mi];
    const kind = CAT_AV.test(f.name) ? 'shiur' : 'material';
    /* Solo tomamos el título del catálogo si el tipo de archivo coincide con el
       del módulo: un PDF dentro de un módulo de shiurim conserva su propio nombre */
    const tramo = catTramo(mod, f);
    const hallado = kind === mod.kind ? catMatchFile(f.name, tramo.items) : 0;
    return { f, mi, kind, n: hallado ? hallado + tramo.off : 0 };
  });
}

function catDirPreview(){
  const files = [...($('cat-dir').files || [])];
  window._catPlan = catPlan(files);
  const el = $('cat-dir-sum'), go = $('cat-dir-go');
  if (!el) return;
  const ok = window._catPlan.filter(p => p.mi >= 0 || p.siman);
  const lost = window._catPlan.length - ok.length;
  if (!ok.length){
    el.innerHTML = `<div class="hint">${t('catDirNone')}</div>`;
    if (go) go.disabled = true;
    return;
  }
  const byMod = {};
  ok.forEach(p => { const k = p.mi >= 0 ? p.mi : 's' + p.siman; (byMod[k] = byMod[k] || []).push(p); });
  el.innerHTML = `<div class="field"><label>${ok.length} ${t('catFilesN')}</label>` +
    Object.keys(byMod).map(mi => {
      const list = byMod[mi];
      const unmatched = list.filter(p => !p.n).length;
      const nombre = mi[0] === 's' ? 'סימן ' + gem(mi.slice(1)) : CATALOG[mi].folder;
      return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:13.5px">

        <span class="badge">${list.length}</span>

      </div>`;
    }).join('') +
    (lost ? `<div class="hint" style="margin-top:8px">${lost} ${t('catDirSkip')}</div>` : '') +
    `</div>`;
  if (go) go.disabled = false;
}
async function catDirUpload(){
  const plan = (window._catPlan || []).filter(p => p.mi >= 0 || p.siman);
  if (!plan.length) return toast(t('catNoFile'));
  const btn = $('cat-dir-go'); btn.disabled = true; btn.textContent = t('uploading');
  $('cat-dir').disabled = true;
  $('up-prog').style.display = 'block';
  let ok = 0, dup = 0;
  const fallidos = [];
  try {
    /* Crear los módulos que falten antes de subir nada */
    for (const mi of [...new Set(plan.filter(p => p.mi >= 0).map(p => p.mi))]){
      if (!catSiman(CATALOG[mi])) await catCreateModule(mi, true);
    }
    /* Lo ya subido antes no se vuelve a subir */
    const [shs, mts] = await Promise.all([
      sb.from(T.shiurim).select('simanId,fileName'),
      sb.from(T.materials).select('simanId,fileName')
    ]);
    const seen = new Set([...(shs.data||[]), ...(mts.data||[])].map(r => r.simanId + '|' + r.fileName));
    for (let k = 0; k < plan.length; k++){
      const { f, mi, kind, n, siman } = plan[k];
      const mod = mi >= 0 ? CATALOG[mi] : null;
      const s = mod ? catSiman(mod) : await catEnsureSiman(siman);
      if (!s) continue;
      if (seen.has(s.id + '|' + f.name)){ dup++; continue; }
      const tbl = kind === 'shiur' ? T.shiurim : T.materials;
      const title = n ? mod.items[n-1] : catTituloLibre(f.name);
      const path = tbl + '/' + Date.now() + '_' + k + '_' + (f.name || 'archivo').replace(/[^\w.\-]+/g, '_');
      try {
        await uploadWithProgress(path, f, `(${k+1}/${plan.length}) `);
        const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        const meta = { url, fileName: f.name, size: f.size, storagePath: path };
        const { error } = await sb.from(tbl).insert({
          simanId: s.id, saifim: catSaifDeShiur(title), title, ...meta, uploadedBy: ME.name
        });
        fail(error);
        seen.add(s.id + '|' + f.name);
        ok++;
        /* Un sefer con rango de simanim queda también en el contenido de cada uno */
        if (tbl === T.materials) ok += await catSpreadSefer(title, meta, seen);
      } catch(e){
        /* Un archivo que falla no puede tirar los otros 167: se anota y se sigue */
        fallidos.push({ ...plan[k], _err: e.message });
      }
    }
    const resumen = ok + ' ' + t('catUploaded') + (dup ? ' · ' + dup + ' ' + t('catDirDup') : '');
    show(CUR.view); notifBadge();
    if (!fallidos.length){ window._catPlan = []; closeSheet(); return toast(resumen); }
    /* Quedan pendientes: se dejan cargados para reintentar solo esos */
    window._catPlan = fallidos;
    toast(resumen + ' · ' + fallidos.length + ' ' + t('catFailed'));
    const sum = $('cat-dir-sum');
    if (sum) sum.innerHTML = `<div class="field"><label>${fallidos.length} ${t('catFailed')}</label>` +
      fallidos.map(x => `<div style="font-size:13px;color:var(--muted);margin-bottom:4px">
        ${esc(x.f.name)} — ${esc(x._err || '')}</div>`).join('') + `</div>`;
    btn.disabled = false; btn.textContent = t('catRetry');
  } catch(e){
    toast(t('err') + e.message);
    btn.disabled = false; btn.textContent = t('catUploadGo');
    $('cat-dir').disabled = false;
  }
}

   propósito) no vuelve a tocar la base. */
async function catAutoSeed(){
  if (CAT_SEEDED || !isAdmin()) return;
  CAT_SEEDED = true;
  if (CATALOG.some(mod => catSiman(mod))) return;
  try { if (localStorage.getItem('jh_seeded') === '1') return; } catch(e){}

  try { localStorage.setItem('jh_seeded', '1'); } catch(e){}
  toast(t('catAllDone'));
}

  try {
    const paths = [];
    for (const tbl of [T.materials, T.shiurim]){
      const { data } = await sb.from(tbl).select('storagePath').eq('simanId', id);
      (data||[]).forEach(r => { if (r.storagePath) paths.push(r.storagePath); });
    }
    if (paths.length){ try { await sb.storage.from(BUCKET).remove(paths); } catch(e){} }
    for (const tbl of [T.materials, T.shiurim, T.exams, T.mare, T.subs, T.notes, T.shared]){
      await sb.from(tbl).delete().eq('simanId', id);
    }
    const { error } = await sb.from(T.simanim).delete().eq('id', id); fail(error);
    toast(t('simanDeleted'));
    await loadSimanim(); nav(mus ? '/musar' : '/');
  } catch(e){ toast(t('err') + e.message); }

/* ─── helpers de items ─── */
function fileIconKey(name){
  const ext = (name||'').split('.').pop().toLowerCase();
  if (ext === 'pdf') return ['red','filetext'];
  if (['jpg','jpeg','png','gif','webp','heic'].includes(ext)) return ['','img'];
  if (['mp3','m4a','aac','wav','ogg','opus','amr','caf','wma','aif','aiff'].includes(ext)) return ['gold','audio'];
  return ['','file'];
}
function isViewable(name){
  const ext = (name||'').split('.').pop().toLowerCase();
  return ['pdf','jpg','jpeg','png','gif','webp'].includes(ext);
}
const VFILES = {};
function regFile(f){ const k = 'f' + Math.random().toString(36).slice(2,9); VFILES[k] = f; return k; }
function openViewerK(k, big){
  const f = VFILES[k]; if (!f) return;
  const ext = (f.fileName||'').split('.').pop().toLowerCase();
  const inner = ['jpg','jpeg','png','gif','webp'].includes(ext)
    ? `<img class="viewer-img" src="${esc(f.url)}" alt="">`
    : `<iframe class="viewer-frame" src="${esc(f.url)}"></iframe>`;
  openSheet(`<div class="sheet-head"><h3>${esc(f.title || f.fileName)}</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="xbtn" style="width:auto;padding:0 14px;font-size:13px;font-weight:700" onclick="openViewerK('${k}', ${big ? 'false' : 'true'})">${big ? t('shrink') : t('expand')}</button>
        <button class="xbtn" onclick="closeSheet()">${icon('x')}</button>
      </div></div>
    ${inner}
    <div style="margin-top:14px;text-align:center"><a class="btn ghost sm" href="${esc(f.url)}" target="_blank" rel="noopener" style="text-decoration:none">${t('open')} ↗</a></div>`, true);
  if (big) $('sheet').classList.add('full');
}

/* ═══════════ Subida de archivos ═══════════ */
function uploadOnce(path, file, label){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    /* upsert: un reintento reescribe el objeto a medio subir en vez de chocar con 409 */
    xhr.setRequestHeader('x-upsert', 'true');
    xhr.timeout = 0;
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      const bar = $('up-bar'), hint = $('up-hint');
      if (bar) bar.style.width = pct + '%';
      if (hint) hint.textContent = (label||'') + pct + '% · ' + fmtSize(e.loaded) + ' ' + t('ofWord') + ' ' + fmtSize(e.total);
    };
    xhr.onload = () => {
      if (xhr.status < 300) return resolve();
      const body = (xhr.responseText || '').slice(0, 200);
      /* 413: el archivo pasa el límite del bucket. Reintentar no sirve, hay que subir el límite */
      const msg = xhr.status === 413 ? t('errTooBig') : 'HTTP ' + xhr.status + ' — ' + body;
      const err = new Error(msg);
      err.retriable = xhr.status === 429 || xhr.status >= 500;
      reject(err);
    };
    xhr.onerror   = () => { const e = new Error(t('netErr')); e.retriable = true; reject(e); };
    xhr.ontimeout = () => { const e = new Error(t('netErr')); e.retriable = true; reject(e); };
    xhr.send(file);
  });
}
/* Los shiurim son archivos grandes: un corte de red puntual no debe tirar toda la carga */
async function uploadWithProgress(path, file, label){
  let last;
  for (let intento = 1; intento <= 3; intento++){
    try { return await uploadOnce(path, file, (label || '') + (intento > 1 ? '· ' + t('catTry') + ' ' + intento + ' ' : '')); }
    catch(e){
      last = e;
      if (!e.retriable) throw e;
      await new Promise(r => setTimeout(r, 1500 * intento * intento));
    }
  }
  throw last;
}
async function uploadMany(folder, files){
  const out = [];
  for (let i = 0; i < files.length; i++){
    const f = files[i];
    const path = folder + '/' + Date.now() + '_' + i + '_' + (f.name || 'archivo').replace(/[^\w.\-]+/g,'_');
    await uploadWithProgress(path, f, files.length > 1 ? `(${i+1}/${files.length}) ` : '');
    out.push({ fileName: f.name, size: f.size, storagePath: path,
      url: sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl });
  }
  return out;
}

/* ═══════════ Reproductor ═══════════ */
const audio = $('audio');
/* Un fallo de red o un formato que el celular no soporta dejaban el shiur mudo
   y sin aviso: así al menos se ve qué pasó. */
audio.addEventListener('error', () => {
  if (!PL.id) return;
  const c = (audio.error && audio.error.code) || 0;
  toast(t('playErr') + (c ? ' · ' + c : ''));
});
let PL = { id:null, playing:false };
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 2.5, 3, 0.75];
function playShiur(id){
  const x = SHIUR_CACHE.find(s => s.id === id);
  if (!x) return;
  if (PL.id === id){ togglePlay(); return; }
  PL.id = id;
  const saved = parseFloat(localStorage.getItem('jh_pos_' + id) || '0');
  audio.preload = 'metadata';
  audio.src = x.url;
  /* En iOS, tocar currentTime antes de que carguen los metadatos lanza
     InvalidStateError y cortaba la reproducción entera. Se retoma la posición
     recién cuando el navegador sabe la duración. */
  audio.addEventListener('loadedmetadata', function once(){
    audio.removeEventListener('loadedmetadata', once);
    if (PL.id !== id) return;                       /* ya cambió de shiur */
    if (saved > 5 && saved < audio.duration - 10){
      try { audio.currentTime = saved; } catch(e){}
    }
  });
  const sm = getSiman(x.simanId);
  /* Salida de emergencia: si el celular no reproduce dentro de la app, el
     mismo archivo se abre en el reproductor del teléfono */
  const abrir = $('pl-open'); if (abrir) abrir.href = x.url;
  $('pl-title').textContent = x.title;
  $('pl-sub').innerHTML = (isMusar(sm)
    ? esc(sm.title || t('sija'))
    : t('siman') + ' <bdi>' + gem(sm?.number||'') + '</bdi>') + ' · ' + saifLabel(x.saifim, x.simanId);
  $('player').classList.add('show');
  MARKS = []; renderMarks(); loadMarks();
  /* play() devuelve una promesa: si el navegador la rechaza hay que enterarse,
     si no el shiur queda mudo sin decir por qué. */
  const arranque = audio.play();
  if (arranque && arranque.catch) arranque.catch(e => toast(t('playErr') + (e && e.name ? ' · ' + e.name : '')));
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title: x.title, artist: APP_NAME });
  }
}
function togglePlay(){
  if (!PL.id) return;
  if (!audio.paused) return audio.pause();
  const p = audio.play();
  if (p && p.catch) p.catch(e => toast(t('playErr') + (e && e.name ? ' · ' + e.name : '')));
}
function skip(sec){
  if (!PL.id || !audio.duration) return;            /* sin metadatos no se puede buscar */
  try { audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec)); } catch(e){}
}
function cycleSpeed(){
  const i = SPEEDS.indexOf(audio.playbackRate);
  audio.playbackRate = SPEEDS[(i+1) % SPEEDS.length];
  $('pl-speed').textContent = audio.playbackRate + 'x';
}
function closePlayer(){
  audio.pause(); audio.removeAttribute('src'); audio.load();
  PL = { id:null, playing:false };
  MARKS = []; renderMarks();
  $('player').classList.remove('show');
  refreshPlayBtns();
}

      const i = (n.targetId || '').lastIndexOf('_');
      return '/mare/' + n.targetId.slice(0, i) + '/' + n.targetId.slice(i + 1);
    }
    const map = { material:'/item/m/', shiur:'/item/s/', exam:'/item/e/', shared:'/item/c/', news:'/news/', question:'/qa/' };

}
