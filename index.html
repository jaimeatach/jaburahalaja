<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>חבורת הלכה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231E4E8C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='serif'>ה</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBFD;
  --card:#FFFFFF;
  --ink:#1C1C22;
  --muted:#71717A;
  --line:#E8E8ED;
  --blue:#1E4E8C;
  --blue-d:#173E71;
  --blue-soft:#EEF3FA;
  --gold:#A8873B;
  --gold-soft:#F7F1E3;
  --green:#2E7D5B;
  --green-soft:#E9F4EF;
  --red:#C0453C;
  --red-soft:#FBEDEC;
  --radius:18px;
  --shadow:0 1px 2px rgba(28,28,34,.04), 0 8px 28px rgba(28,28,34,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Assistant',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.55}
h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:#ABABB4}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#F3F3F7 0%, var(--paper) 55%)}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:40px 32px 32px;box-shadow:var(--shadow);text-align:center;position:relative}
.auth-mark{width:64px;height:64px;border-radius:19px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  font-family:'Frank Ruhl Libre',serif;font-size:34px;font-weight:700;box-shadow:0 10px 24px rgba(30,78,140,.28)}
.auth-card h1{font-size:30px;font-weight:900;margin-bottom:4px}
.auth-sub{color:var(--muted);margin-bottom:26px;font-size:15px}
.auth-lang{position:absolute;top:16px;inset-inline-end:16px}
.field{text-align:start;margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#FBFBFD}
.field input:focus,.field textarea:focus{border-color:var(--blue);outline:none;background:#fff}
.auth-err{display:none;background:var(--red-soft);color:var(--red);border-radius:11px;padding:10px 14px;font-size:14px;margin-bottom:14px;text-align:start}
.auth-switch{margin-top:18px;font-size:14px;color:var(--muted)}
.auth-switch button{color:var(--blue);font-weight:600}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;
  font-weight:600;font-size:15px;padding:11px 22px;border-radius:999px;transition:background .15s, transform .1s}
.btn:hover{background:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid #C9D6E8}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.soft:hover{background:#E1EAF6}
.btn.danger{background:transparent;color:var(--red);border:1px solid #EACFCC}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:7px 15px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s;flex:none}
.iconbtn:hover{background:#EFEFF4;color:var(--ink)}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(251,251,253,.82);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hbar{max-width:940px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.hmark{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-size:20px;font-weight:700}
.htitle{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:19px;white-space:nowrap}
.hspace{flex:1}
.langtoggle{display:flex;background:#EFEFF4;border-radius:999px;padding:3px;flex:none}
.langtoggle button{padding:4px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted);transition:all .15s}
.langtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.avatarbtn{display:flex;align-items:center;gap:9px;padding:4px;padding-inline-end:13px;border-radius:999px;transition:background .15s;max-width:210px}
.avatarbtn:hover{background:#EFEFF4}
.avatarbtn .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:100px;height:100px;font-size:40px;border-radius:50%}
nav.tabs{max-width:940px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.navtab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:all .15s}
.navtab.on{background:var(--ink);color:#fff}
.navtab:not(.on):hover{background:#EFEFF4;color:var(--ink)}

main{max-width:940px;margin:0 auto;padding:26px 20px 160px}

/* ---------- Home ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h2{font-size:28px;font-weight:900}
.pagehead .sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.siman-list{display:flex;flex-direction:column;gap:12px}
.siman-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.siman-card:hover{border-color:#CBD6E5;box-shadow:var(--shadow)}
.siman-med{width:52px;height:52px;flex:none;border-radius:15px;background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-size:23px;font-weight:700}
.siman-info{flex:1;min-width:0}
.siman-info .t{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18.5px}
.siman-info .m{color:var(--muted);font-size:13.5px;margin-top:2px}
.siman-arrow{color:#C6C6CE;font-size:20px}
html[dir=ltr] .siman-arrow{transform:scaleX(-1)}

/* ---------- Siman view ---------- */
.qnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;align-items:center}
.qnav::-webkit-scrollbar{display:none}
.qchip{min-width:42px;height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-family:'Frank Ruhl Libre',serif;font-size:16px;font-weight:700;color:var(--muted);flex:none;transition:all .15s;display:flex;align-items:center;justify-content:center}
.qchip:hover{border-color:var(--blue);color:var(--blue)}
.qchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qback{flex:none;font-family:'Assistant';font-size:14px;font-weight:600;color:var(--muted);padding:0 10px;height:38px;display:flex;align-items:center;border-radius:999px}
.qback:hover{background:#EFEFF4;color:var(--ink)}
.siman-head{margin-bottom:8px}
.siman-head .eyebrow{color:var(--gold);font-weight:700;font-size:14px}
.siman-head h2{font-size:32px;font-weight:900;line-height:1.2}
.saif-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.saif-chip{min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-family:'Frank Ruhl Libre',serif;font-size:18px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.saif-chip:hover{border-color:var(--blue)}
.saif-chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(30,78,140,.28)}
.saif-chip.alt{font-family:'Assistant';font-size:14px;font-weight:700}
.saif-title-line{color:var(--muted);font-size:14.5px;min-height:22px;margin-bottom:14px}
.seg{display:flex;background:#EFEFF4;border-radius:15px;padding:4px;gap:4px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:all .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.09)}

/* ---------- Panels / items ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.mare-text{font-family:'Frank Ruhl Libre',serif;font-size:19px;line-height:2;white-space:pre-wrap}
.item-list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.item .ic{width:44px;height:44px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
.ic.pdf{background:var(--red-soft)}
.ic.file{background:var(--blue-soft)}
.item .body{flex:1;min-width:180px}
.item .t{font-weight:600;font-size:15.5px}
.item .m{color:var(--muted);font-size:13px;margin-top:1px}
.badge{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.gray{background:#EFEFF4;color:var(--muted)}
.playbtn{width:46px;height:46px;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s, transform .1s}
.playbtn:hover{background:var(--blue-d)}
.playbtn:active{transform:scale(.95)}
.playbtn.playing{background:var(--gold)}
.playbtn svg{width:18px;height:18px}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty .e-ic{font-size:34px;margin-bottom:10px;opacity:.55}
.empty .e-t{font-weight:600;color:var(--ink);margin-bottom:2px;font-size:16px}
.addrow{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.allsaif-block{margin-bottom:30px}
.allsaif-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.allsaif-head .med{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-size:17px;font-weight:700}
.allsaif-head .t{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18px}
.subhead{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}

/* ---------- Exams ---------- */
.exam-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.exam-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.exam-top .body{flex:1;min-width:200px}
.exam-top .t{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18px}
.exam-top .m{color:var(--muted);font-size:13.5px;margin-top:2px}
.exam-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grade-big{font-family:'Frank Ruhl Libre',serif;font-size:30px;font-weight:900;color:var(--blue)}
.q-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px;background:#FBFBFD}
.q-card .qt{font-weight:700;margin-bottom:10px;font-size:15.5px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;transition:all .12s;font-size:15px}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt input{accent-color:var(--blue)}

/* ---------- Notas ---------- */
.notes-toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;background:#FBFBFD;position:sticky;top:106px;z-index:5}
.ntb{min-width:34px;height:34px;padding:0 8px;border-radius:9px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .12s}
.ntb:hover{background:#EFEFF4}
.ntb u{text-decoration-thickness:2px}
.ntsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.colordot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none;transition:transform .12s}
.colordot:hover{transform:scale(1.15)}
.notes-editor{min-height:280px;border:1px solid var(--line);border-radius:0 0 16px 16px;padding:18px;background:#fff;line-height:1.85;font-size:16px}
.notes-editor:focus{outline:none;border-color:#C9D6E8}
.notes-editor:empty:before{content:attr(data-ph);color:#ABABB4}
.note-prev{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.note-prev:hover{border-color:#CBD6E5;box-shadow:var(--shadow)}
.note-prev .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.note-prev .body{color:var(--muted);font-size:14px;max-height:66px;overflow:hidden}

/* ---------- Perfil ---------- */
.profile-top{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px 24px;text-align:center}
.profile-top h2{font-size:26px;font-weight:900}
.photo-edit{position:relative;cursor:pointer}
.photo-edit .cam{position:absolute;bottom:0;inset-inline-end:0;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper);font-size:14px}

/* ---------- Tablas ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:start;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid #F1F1F4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,22,28,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:26px 24px 34px;transform:translateY(30px);transition:transform .22s}
.sheet.wide{max-width:940px}
.overlay.open .sheet{transform:translateY(0)}
@media(min-width:700px){
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:24px;padding:30px}
  .overlay.open .sheet{transform:none}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
.sheet-head h3{font-size:21px;font-weight:900}
.xbtn{width:34px;height:34px;border-radius:50%;background:#EFEFF4;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.xbtn:hover{background:#E4E4EA;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .chip{padding:8px 14px;min-width:42px;border-radius:999px;border:1px solid var(--line);background:#fff;font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:15px;transition:all .12s;text-align:center}
.chips .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.progress{height:8px;background:#EFEFF4;border-radius:99px;overflow:hidden;margin-top:14px;display:none}
.progress .bar{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .2s}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.viewer-frame{width:100%;height:72vh;border:none;border-radius:14px;background:#EFEFF4}
.viewer-img{width:100%;max-height:72vh;object-fit:contain;border-radius:14px;background:#EFEFF4}

/* ---------- Player ---------- */
#player{position:fixed;bottom:0;left:0;right:0;z-index:80;transform:translateY(120%);transition:transform .25s}
#player.show{transform:translateY(0)}
.pl-inner{max-width:940px;margin:0 auto;padding:0 12px 12px}
.pl-card{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 -4px 30px rgba(28,28,34,.14);padding:12px 16px}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-info{flex:1;min-width:0}
.pl-info .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-info .m{font-size:12.5px;color:var(--muted)}
.pl-ctrl{display:flex;align-items:center;gap:4px}
.pl-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .15s;flex:none}
.pl-btn:hover{background:#EFEFF4}
.pl-btn.main{width:46px;height:46px;background:var(--blue);color:#fff}
.pl-btn.main:hover{background:var(--blue-d)}
.pl-btn svg{width:20px;height:20px}
.pl-speed{font-weight:700;font-size:13px;min-width:46px;height:32px;border-radius:999px;background:#EFEFF4;color:var(--ink);flex:none}
.pl-speed:hover{background:#E4E4EA}
.pl-seek{display:flex;align-items:center;gap:10px;margin-top:8px}
.pl-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
input[type=range].seek{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:linear-gradient(to left, var(--blue) var(--fill,0%), #E4E4EA var(--fill,0%));cursor:pointer}
html[dir=ltr] input[type=range].seek{background:linear-gradient(to right, var(--blue) var(--fill,0%), #E4E4EA var(--fill,0%))}
input[type=range].seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range].seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--blue)}

/* ---------- Toast / setup / misc ---------- */
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.setup{max-width:600px;margin:50px auto;padding:0 20px}
.setup .panel{padding:30px}
.setup h2{font-size:24px;margin-bottom:10px}
.setup p{margin-bottom:8px;color:var(--muted)}
.setup code{background:#EFEFF4;padding:2px 7px;border-radius:6px;font-size:14px;direction:ltr;display:inline-block}
.spin{width:22px;height:22px;border:3px solid #DEDEE6;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-full{min-height:100vh;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:520px){
  .pagehead h2{font-size:24px}

function gem(n){
  n = parseInt(n);
  if (!n || n < 1 || n > 999) return String(n);
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const hunds=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s = hunds[Math.floor(n/100)]; n %= 100;
  if (n === 15) return s + 'טו';
  if (n === 16) return s + 'טז';
  return (s + tens[Math.floor(n/10)] + ones[n%10]) || String(n);
}
function parseHebNum(str){ // acepta "340" o "שמ" → 340
  str = String(str||'').trim().replace(/["'׳״\s.]/g,'');
  if (!str) return NaN;
  if (/^\d+$/.test(str)) return parseInt(str);
  const map = {'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400};
  let n = 0;
  for (const ch of str){ if (!(ch in map)) return NaN; n += map[ch]; }
  return n || NaN;
}
function saifLabel(saifim){
  if (!saifim || !saifim.length) return '';
  const s = [...saifim].sort((a,b)=>a-b);
  const w = { he:['סעיף ','סעיפים '], es:['Saif ','Saifim '] }[LANG] || ['סעיף ','סעיפים '];
  if (s.length === 1) return w[0] + gem(s[0]);
  const contiguous = s.every((v,i)=> i===0 || v === s[i-1]+1);
  if (contiguous) return w[1] + gem(s[0]) + '–' + gem(s[s.length-1]);
  return w[1] + s.map(gem).join(', ');
}
function fmtSize(b){ if(!b) return ''; if(b<1024*1024) return Math.round(b/1024)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fmtDate(ts){ try{ const d=new Date(ts); if(isNaN(d)) return ''; return d.toLocaleDateString(LANG==='he'?'he-IL':'es-MX',{day:'numeric',month:'short',year:'numeric'});}catch(e){return ''} }
function fmtTime(sec){ if(!isFinite(sec)) return '0:00'; sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randSalt(){ return [...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join(''); }
let toastTimer;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}
function openSheet(html, wide){
  const sh = $('sheet');
  sh.classList.toggle('wide', !!wide);
  sh.innerHTML = html;
  $('overlay').classList.add('open');
}
function closeSheet(){ $('overlay').classList.remove('open'); }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function sheetHead(title){
  return `<div class="sheet-head"><h3>${esc(title)}</h3><button class="xbtn" onclick="closeSheet()">✕</button></div>`;
}

function renderAuth(mode='login'){
  window._authMode = mode;
  const isReg = mode === 'register';
  app.innerHTML = `
  <div class="auth-wrap"><div class="auth-card">
    <div class="auth-lang">${langToggleHTML()}</div>
    <div class="auth-mark">ה</div>

    <div class="field"><label>${t('password')}</label>
      <input id="a-pass" type="password" autocomplete="${isReg?'new-password':'current-password'}" placeholder="••••••"></div>
    ${isReg ? `<div class="field"><label>${t('password2')}</label>
      <input id="a-pass2" type="password" autocomplete="new-password" placeholder="••••••"></div>` : ''}
    <button class="btn full" id="a-go" style="margin-top:6px">${isReg?t('register'):t('login')}</button>
    <div class="auth-switch">${isReg
      ? `${t('haveAccount')} <button onclick="renderAuth('login')">${t('login')}</button>`
      : `${t('newHere')} <button onclick="renderAuth('register')">${t('registerLink')}</button>`}</div>
  </div></div>`;
  const go = $('a-go');
  const submit = () => isReg ? doRegister() : doLogin();
  go.onclick = submit;
  app.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key==='Enter') submit(); }));
  $('a-name').focus();
}
function authErr(msg){ const e=$('a-err'); e.textContent=msg; e.style.display='block'; }
const userId = name => name.trim().replace(/\s+/g,' ').toLowerCase();

async function doRegister(){
  const name = $('a-name').value.trim().replace(/\s+/g,' ');
  const p1 = $('a-pass').value, p2 = $('a-pass2').value;
  if (name.length < 2) return authErr(t('errName'));
  if (p1.length < 4)   return authErr(t('errPass4'));
  if (p1 !== p2)       return authErr(t('errPassMatch'));
  const btn = $('a-go'); btn.disabled = true; btn.textContent = t('wait');
  try {
    const id = userId(name);
    const { data: exist, error: e1 } = await sb.from(T.users).select('id').eq('id', id).maybeSingle();
    fail(e1);
    if (exist){ authErr(t('errUserExists')); btn.disabled=false; btn.textContent=t('register'); return; }
    const { count, error: e2 } = await sb.from(T.users).select('id', { count:'exact', head:true });
    fail(e2);
    const first = !count;
    const salt = randSalt();
    const hash = await sha256(salt + p1);
    const { error: e3 } = await sb.from(T.users).insert({ id, name, salt, hash, role: first ? 'admin' : 'member' });
    fail(e3);
    ME = { id, name, role: first ? 'admin' : 'member', photo: null };
    saveSession();
    toast(first ? t('welcomeFirst') : t('welcome'));
    await loadSimanim(); renderApp();
  } catch(e){ authErr(t('err') + e.message); btn.disabled=false; btn.textContent=t('register'); }
}
async function doLogin(){
  const name = $('a-name').value.trim();
  const pass = $('a-pass').value;
  if (!name || !pass) return authErr(t('errFill'));
  const btn = $('a-go'); btn.disabled = true; btn.textContent = t('wait');
  try {
    const { data: u, error } = await sb.from(T.users).select('*').eq('id', userId(name)).maybeSingle();
    fail(error);
    if (!u){ authErr(t('errUserNotFound')); btn.disabled=false; btn.textContent=t('login'); return; }
    const hash = await sha256(u.salt + pass);
    if (hash !== u.hash){ authErr(t('errWrongPass')); btn.disabled=false; btn.textContent=t('login'); return; }
    ME = { id: u.id, name: u.name, role: u.role, photo: u.photo };
    saveSession();
    await loadSimanim(); renderApp();
  } catch(e){ authErr(t('err') + e.message); btn.disabled=false; btn.textContent=t('login'); }
}
function logout(){ ME = null; clearSession(); closePlayer(); renderAuth(); }

function sePreview(){
  const n = parseHebNum($('se-num').value);
  const c = parseHebNum($('se-count').value);
  const el = $('se-preview'); if (!el) return;
  if (n && c) el.innerHTML = `✓ ${t('siman')} <b class="serif">${gem(n)}</b> (${n}) · ${t('willCreate')} <b>${c}</b> ${t('saifimWord')}: <span class="serif">${gem(1)}–${gem(c)}</span>`;
  else el.textContent = '';
}
async function createSimanQuick(){
  const number = parseHebNum($('se-num').value);
  const count  = parseHebNum($('se-count').value);
  if (!number || number < 1 || number > 999) return toast(t('invalidNum'));
  if (!count  || count  < 1 || count  > 200) return toast(t('invalidCount'));
  const saifim = Array.from({length:count}, (_,i)=>({ n:i+1, title:'' }));
  try {
    const { data, error } = await sb.from(T.simanim)
      .insert({ number, title: $('se-title').value.trim(), saifim }).select().single();
    fail(error);
    closeSheet(); toast(t('simanCreated'));
    await loadSimanim();
    go('siman', data.id);
  } catch(e){ toast(t('err') + e.message); }
}
function seRender(){
  $('se-saifim').innerHTML = window._seSaifim.map((sf,i)=>`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);flex:none;display:flex;align-items:center;justify-content:center;font-family:'Frank Ruhl Libre',serif;font-weight:700">${gem(i+1)}</div>

        value="${esc(sf.title||'')}" placeholder="${t('saifTitlePh')}" oninput="window._seSaifim[${i}].title=this.value">
      ${i === window._seSaifim.length-1 && window._seSaifim.length>1 ? `<button class="iconbtn" onclick="window._seSaifim.pop();seRender()">✕</button>`:''}
    </div>`).join('');
}
function seAddSaif(){ window._seSaifim.push({n:window._seSaifim.length+1,title:''}); seRender(); }
async function saveSimanEdit(id){
  const number = parseHebNum($('se-num').value);
  if (!number || number < 1) return toast(t('invalidNum'));
  try {
    const { error } = await sb.from(T.simanim).update({
      number, title: $('se-title').value.trim(),
      saifim: window._seSaifim.map((sf,i)=>({ n:i+1, title:(sf.title||'').trim() }))
    }).eq('id', id);
    fail(error);
    closeSheet(); toast(t('simanUpdated'));
    await loadSimanim();
    CUR.view === 'siman' ? renderSiman() : renderHome();
  } catch(e){ toast(t('err') + e.message); }
}
async function deleteSiman(id){
  closeSheet();
  if (!await confirmDlg(t('delSimanQ'))) return;
  try {
    const paths = [];
    for (const tbl of [T.materials, T.shiurim]){
      const { data } = await sb.from(tbl).select('storagePath').eq('simanId', id);
      (data||[]).forEach(r => { if (r.storagePath) paths.push(r.storagePath); });
    }
    if (paths.length){ try { await sb.storage.from(BUCKET).remove(paths); } catch(e){} }
    for (const tbl of [T.materials, T.shiurim, T.exams, T.mare, T.subs, T.notes]){
      await sb.from(tbl).delete().eq('simanId', id);
    }
    const { error } = await sb.from(T.simanim).delete().eq('id', id); fail(error);
    toast(t('simanDeleted'));
    await loadSimanim(); go('home');
  } catch(e){ toast(t('err') + e.message); }
}

/* ─── helpers de items reutilizables ─── */
function fileIcon(name){
  const ext = (name||'').split('.').pop().toLowerCase();
  if (ext === 'pdf') return ['pdf','📕'];
  if (['jpg','jpeg','png','gif','webp','heic'].includes(ext)) return ['file','🖼️'];
  if (['doc','docx'].includes(ext)) return ['file','📄'];
  return ['file','📎'];
}
function isViewable(name){
  const ext = (name||'').split('.').pop().toLowerCase();
  return ['pdf','jpg','jpeg','png','gif','webp'].includes(ext);
}
function materialHTML(m){
  const [cls,ic] = fileIcon(m.fileName);
  return `<div class="item">
    <div class="ic ${cls}">${ic}</div>
    <div class="body">

      <div class="m">${saifLabel(m.saifim)} · ${fmtSize(m.size)} · ${fmtDate(m.createdAt)}</div>

    ${isViewable(m.fileName) ? `<button class="btn soft sm" onclick="openViewer('${m.id}')">${t('viewHere')}</button>` : ''}

    ${isAdmin() ? `<button class="iconbtn" onclick="deleteItem('${T.materials}','${m.id}','${esc(m.storagePath||'')}')">🗑️</button>`:''}
  </div>`;
}

    <div class="progress" id="up-prog"><div class="bar" id="up-bar"></div></div>
    <div class="hint" id="up-hint"></div>`);
}
function uploadWithProgress(path, file){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      $('up-bar').style.width = pct + '%';
      $('up-hint').textContent = pct + '% · ' + fmtSize(e.loaded) + ' ' + t('ofWord') + ' ' + fmtSize(e.total);
    };
    xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error('HTTP ' + xhr.status + ' — ' + xhr.responseText.slice(0,200)));
    xhr.onerror = () => reject(new Error(t('netErr')));
    xhr.send(file);
  });
}
async function doUpload(tbl){
  const title = $('up-title').value.trim();
  const file = $('up-file').files[0];
  const saifim = [...document.querySelectorAll('#up-chips .chip.on')].map(c => parseInt(c.dataset.n));
  if (!title)  return toast(t('needTitle'));
  if (!file)   return toast(t('needFile'));
  if (!saifim.length) return toast(t('needSaif'));
  const btn = $('up-go'); btn.disabled = true; btn.textContent = t('uploading');
  $('up-prog').style.display = 'block';
  const path = tbl + '/' + Date.now() + '_' + (file.name || 'archivo').replace(/[^\w.\-]+/g,'_');
  try {
    await uploadWithProgress(path, file);
    const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const { error } = await sb.from(tbl).insert({
      simanId: CUR.simanId, saifim, title, url,
      fileName: file.name, size: file.size, storagePath: path, uploadedBy: ME.name
    });
    fail(error);
    closeSheet(); toast(t('uploadedOk')); renderSiman();
  } catch(e){
    toast(t('err') + e.message);
    btn.disabled = false; btn.textContent = t('upload');
  }
}

/* ═══════════ Reproductor ═══════════ */
const audio = $('audio');
let PL = { id:null, playing:false };
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 2.5, 3, 0.75];
function playShiur(id){
  const x = SHIUR_CACHE.find(s => s.id === id);
  if (!x) return;
  if (PL.id === id){ togglePlay(); return; }
  PL.id = id;
  audio.src = x.url;
  const saved = parseFloat(localStorage.getItem('jh_pos_' + id) || '0');
  audio.currentTime = 0;
  audio.addEventListener('loadedmetadata', function once(){
    if (saved > 5 && saved < audio.duration - 10) audio.currentTime = saved;
    audio.removeEventListener('loadedmetadata', once);
  });
  const sm = getSiman(x.simanId);
  $('pl-title').textContent = x.title;
  $('pl-sub').textContent = t('siman') + ' ' + gem(sm?.number||'') + ' · ' + saifLabel(x.saifim);
  $('player').classList.add('show');
  audio.play();
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title: x.title, artist: APP_NAME });
  }
}
function togglePlay(){ if (!PL.id) return; audio.paused ? audio.play() : audio.pause(); }
function skip(sec){ if (PL.id) audio.currentTime = Math.max(0, Math.min(audio.duration||1e9, audio.currentTime + sec)); }
function cycleSpeed(){
  const i = SPEEDS.indexOf(audio.playbackRate);
  audio.playbackRate = SPEEDS[(i+1) % SPEEDS.length];
  $('pl-speed').textContent = audio.playbackRate + 'x';
}
function closePlayer(){
  audio.pause(); audio.removeAttribute('src'); audio.load();
  PL = { id:null, playing:false };
  $('player').classList.remove('show');
  refreshPlayBtns();
}
function refreshPlayBtns(){
  document.querySelectorAll('.playbtn').forEach(b => {
    const id = b.id.replace('pb-','');
    const on = PL.id === id && PL.playing;
    b.classList.toggle('playing', on);
    b.innerHTML = on
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  });
}
audio.addEventListener('play',  ()=>{ PL.playing = true;  $('pl-ic-play').style.display='none'; $('pl-ic-pause').style.display='block'; refreshPlayBtns(); });
audio.addEventListener('pause', ()=>{ PL.playing = false; $('pl-ic-play').style.display='block'; $('pl-ic-pause').style.display='none'; refreshPlayBtns(); });
audio.addEventListener('timeupdate', ()=>{
  if (!PL.id || !isFinite(audio.duration)) return;
  const pct = audio.currentTime / audio.duration * 100;
  const seek = $('pl-seek');
  if (!seek.matches(':active')) seek.value = pct;
  seek.style.setProperty('--fill', pct + '%');
  $('pl-cur').textContent = fmtTime(audio.currentTime);
  $('pl-dur').textContent = fmtTime(audio.duration);
  if (Math.floor(audio.currentTime) % 5 === 0) localStorage.setItem('jh_pos_' + PL.id, audio.currentTime);
});
audio.addEventListener('ended', ()=>{ localStorage.removeItem('jh_pos_' + PL.id); });
$('pl-seek').addEventListener('input', e => {
  if (isFinite(audio.duration)){
    audio.currentTime = e.target.value / 100 * audio.duration;
    e.target.style.setProperty('--fill', e.target.value + '%');
  }
});

async function openTakeExam(examId){

function pickOpt(qi, oi){
  window._answers[qi] = oi;
  document.querySelectorAll(`[id^="opt-${qi}-"]`).forEach(el => el.classList.remove('sel'));
  $(`opt-${qi}-${oi}`).classList.add('sel');
  $(`opt-${qi}-${oi}`).querySelector('input').checked = true;
}
async function submitExam(){
  const e = window._exam, ans = window._answers;
  for (let i = 0; i < ans.length; i++){
    if (ans[i] === null || ans[i] === '') return toast(t('missingAns') + ' ' + (i+1));
  }
  const mcIdx = e.questions.map((q,i)=> q.type==='mc' ? i : -1).filter(i=>i>=0);
  const mcOK  = mcIdx.filter(i => ans[i] === e.questions[i].correct).length;
  const allMC = mcIdx.length === e.questions.length;
  const row = {
    examId: e.id, examTitle: e.title, simanId: e.simanId, saifim: e.saifim,
    userId: ME.id, userName: ME.name,
    answers: ans, mcScore: mcOK, mcTotal: mcIdx.length,
    status: allMC ? 'graded' : 'pending',
    grade: allMC ? Math.round(mcOK / mcIdx.length * 100) : null,
    feedback: allMC ? t('autoChecked') : ''
  };
  try {
    const { error } = await sb.from(T.subs).insert(row);
    fail(error);
    closeSheet();
    toast(allMC ? t('submittedGrade') + row.grade : t('submittedPending'));
    renderSiman();
  } catch(err){ toast(t('err') + err.message); }
}
async function openMySub(subId){
  const { data: sub } = await sb.from(T.subs).select('*').eq('id', subId).maybeSingle();
  if (!sub) return;
  const { data: e } = await sb.from(T.exams).select('*').eq('id', sub.examId).maybeSingle();
  const exam = e || { questions: [] };
  openSheet(`${sheetHead(sub.examTitle)}

      ? `<div style="text-align:center;margin-bottom:20px"><div class="grade-big">${sub.grade}</div>
         <div class="hint">${esc(sub.feedback||'')}</div></div>`
      : `<div style="text-align:center;margin-bottom:20px"><span class="badge gold">${t('pendingRav')}</span></div>`}
    ${exam.questions.map((q,qi)=>{
      const a = sub.answers[qi];
      if (q.type === 'mc'){
        return `<div class="q-card"><div class="qt">${qi+1}. ${esc(q.text)}</div>
          ${q.options.map((op,oi)=>{
            let cls = '';

          }).join('')}</div>`;

      return `<div class="q-card"><div class="qt">${qi+1}. ${esc(q.text)}</div>
        <div style="background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;white-space:pre-wrap">${esc(a)}</div></div>`;

        placeholder="${t('qPh')}" value="${esc(q.text)}" oninput="window._qs[${qi}].text=this.value">
      ${q.type === 'mc' ? `
        ${q.options.map((op,oi)=>`
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <input type="radio" name="exc-${qi}" ${q.correct===oi?'checked':''} onclick="window._qs[${qi}].correct=${oi}"
              style="accent-color:var(--green);width:18px;height:18px;flex:none">
            <input style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff"
              placeholder="${t('optPh')} ${oi+1}" value="${esc(op)}" oninput="window._qs[${qi}].options[${oi}]=this.value">
            ${q.options.length > 2 ? `<button class="iconbtn" onclick="window._qs[${qi}].options.splice(${oi},1);if(window._qs[${qi}].correct>=window._qs[${qi}].options.length)window._qs[${qi}].correct=0;renderQs()">✕</button>`:''}
          </div>`).join('')}
        <button class="btn ghost sm" onclick="window._qs[${qi}].options.push('');renderQs()" ${q.options.length>=6?'disabled':''}>${t('addOpt')}</button>
        <div class="hint">${t('markCorrect')}</div>` : ''}
    </div>`).join('');
}
async function saveExam(){
  const title = $('ex-title').value.trim();
  const saifim = [...document.querySelectorAll('#ex-chips .chip.on')].map(c => parseInt(c.dataset.n));
  if (!title) return toast(t('needExamName'));
  if (!saifim.length) return toast(t('needSaifim'));
  if (!window._qs.length) return toast(t('needQ'));
  for (const [i,q] of window._qs.entries()){
    if (!q.text.trim()) return toast(t('missingQ') + ' ' + (i+1));
    if (q.type === 'mc' && q.options.some(o=>!o.trim())) return toast(t('emptyOpt') + ' ' + (i+1));
  }
  try {
    const { error } = await sb.from(T.exams).insert({
      simanId: CUR.simanId, saifim, title, questions: window._qs, createdBy: ME.name
    });
    fail(error);
    closeSheet(); toast(t('published')); renderSiman();
  } catch(e){ toast(t('err') + e.message); }
}
async function openExamSubs(examId){
  const { data, error } = await sb.from(T.subs).select('*').eq('examId', examId).order('createdAt', { ascending:false });
  fail(error);
  const subs = data || [];
  openSheet(`${sheetHead(t('subsTitle'))}
    ${subs.length ? `<div class="tblwrap"><table class="tbl">
      <tr><th>${t('nameCol')}</th><th>${t('statusCol')}</th><th>${t('gradeCol')}</th><th></th></tr>
      ${subs.map(s=>`<tr>
        <td><b>${esc(s.userName)}</b><div class="hint">${fmtDate(s.createdAt)}</div></td>
        <td>${s.status==='graded'?`<span class="badge green">${t('checked')}</span>`:`<span class="badge gold">${t('pendingBadge')}</span>`}</td>
        <td>${s.status==='graded'?'<b>'+s.grade+'</b>':'—'}</td>
        <td style="text-align:end"><button class="btn soft sm" onclick="openGrade('${s.id}')">${s.status==='graded'?t('viewUpdate'):t('check')}</button></td>
      </tr>`).join('')}
    </table></div>` : `<div class="empty"><div class="e-ic">📭</div><div class="e-t">${t('noSubsT')}</div></div>`}`);
}
async function openGrade(subId){
  const { data: sub } = await sb.from(T.subs).select('*').eq('id', subId).maybeSingle();
  if (!sub) return;
  const { data: e } = await sb.from(T.exams).select('*').eq('id', sub.examId).maybeSingle();
  const exam = e || { questions: [] };
  openSheet(`${sheetHead(t('gradingTitle') + ' · ' + sub.userName)}
    <div class="hint" style="margin:-8px 0 16px">${esc(sub.examTitle)} · ${sub.mcTotal ? t('mcOf') + ' ' + sub.mcScore + '/' + sub.mcTotal + ' ' + t('correctOf') : t('openOnly')}</div>
    ${exam.questions.map((q,qi)=>{
      const a = sub.answers[qi];
      if (q.type === 'mc'){
        const ok = a === q.correct;
        return `<div class="q-card"><div class="qt">${qi+1}. ${esc(q.text)} ${ok?`<span class="badge green">${t('correctBadge')}</span>`:`<span class="badge red">${t('wrongBadge')}</span>`}</div>
          <div class="hint">${t('answered')} ${esc(q.options[a] ?? '—')} · ${t('correctIs')} ${esc(q.options[q.correct])}</div></div>`;
      }
      return `<div class="q-card"><div class="qt">${qi+1}. ${esc(q.text)} <span class="badge gold">${t('openBadge')}</span></div>
        <div style="background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;white-space:pre-wrap">${esc(a)}</div></div>`;
    }).join('')}
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="width:150px"><label>${t('finalGrade')}</label>
        <input id="gr-grade" type="number" min="0" max="100" value="${sub.grade ?? (sub.mcTotal ? Math.round(sub.mcScore/sub.mcTotal*100) : '')}"></div>
      <div class="field" style="flex:1;min-width:200px"><label>${t('fbLabel')}</label>
        <input id="gr-fb" value="${esc(sub.feedback||'')}" placeholder="${t('fbPh')}"></div>
    </div>
    <button class="btn full" onclick="saveGrade('${sub.id}')">${t('saveGrade')}</button>`);
}
async function saveGrade(subId){
  const grade = parseInt($('gr-grade').value);
  if (isNaN(grade) || grade < 0 || grade > 100) return toast(t('gradeRange'));
  try {
    const { error } = await sb.from(T.subs).update({
      grade, feedback: $('gr-fb').value.trim(), status: 'graded',
      gradedBy: ME.name, gradedAt: new Date().toISOString()
    }).eq('id', subId);
    fail(error);
    closeSheet(); toast(t('gradeSaved'));
    if (CUR.view === 'profile') renderProfile('pending'); else renderSiman();
  } catch(e){ toast(t('err') + e.message); }
}

/* ═══════════ Mis notas (editor por saif) ═══════════ */
const noteId = (simanId, saif) => ME.id + '|' + simanId + '|' + saif;
async function renderNotes(s){
  let html = '';
  try {
    const { data } = await sb.from(T.notes).select('html').eq('id', noteId(s.id, CUR.saif)).maybeSingle();
    if (data) html = data.html || '';
  } catch(e){}
  const body = $('tabbody'); if (!body) return;
  const dot = (c, title) => `<button class="colordot" style="background:${c}" title="${title}" onmousedown="event.preventDefault()" onclick="nCmd('foreColor','${c}')"></button>`;
  body.innerHTML = `
    <div class="notes-toolbar">
      <button class="ntb" title="${t('boldT')}" onmousedown="event.preventDefault()" onclick="nCmd('bold')"><b>B</b></button>
      <button class="ntb" title="${t('underT')}" onmousedown="event.preventDefault()" onclick="nCmd('underline')"><u>U</u></button>
      <button class="ntb" title="${t('italT')}" onmousedown="event.preventDefault()" onclick="nCmd('italic')"><i>I</i></button>
      <div class="ntsep"></div>
      <button class="colordot" style="background:linear-gradient(135deg,#FFE58A 50%,#fff 50%)" title="${t('highT')}" onmousedown="event.preventDefault()" onclick="nCmd('hiliteColor','#FFE58A')"></button>
      <button class="colordot" style="background:linear-gradient(135deg,#BDE3C8 50%,#fff 50%)" title="${t('highT')}" onmousedown="event.preventDefault()" onclick="nCmd('hiliteColor','#BDE3C8')"></button>
      <div class="ntsep"></div>
      ${dot('#1C1C22','—')}${dot('#1E4E8C','—')}${dot('#C0453C','—')}${dot('#2E7D5B','—')}${dot('#A8873B','—')}
      <div class="ntsep"></div>
      <button class="ntb" title="${t('clearT')}" style="font-size:13px" onmousedown="event.preventDefault()" onclick="nCmd('removeFormat')">✕A</button>
      <div style="flex:1"></div>
      <button class="btn sm" onclick="saveNotes('${s.id}')">${t('saveNotes')}</button>
    </div>
    <div class="notes-editor" id="note-ed" contenteditable="true" data-ph="${t('notesPh')}">${html}</div>`;
}
function nCmd(cmd, val){
  $('note-ed').focus();
  if (cmd === 'hiliteColor'){ try{ document.execCommand('hiliteColor', false, val); }catch(e){ document.execCommand('backColor', false, val); } return; }
  document.execCommand(cmd, false, val || null);
}
async function saveNotes(simanId){
  try {
    const { error } = await sb.from(T.notes).upsert({
      id: noteId(simanId, CUR.saif), userId: ME.id, simanId, saif: CUR.saif,
      html: $('note-ed').innerHTML, updatedAt: new Date().toISOString()
    });
    fail(error);
    toast(t('notesSaved'));
  } catch(e){ toast(t('err') + e.message); }
}

/* ═══════════ Mi contenido ═══════════ */
async function renderMyContent(){
  const { data, error } = await sb.from(T.notes).select('*').eq('userId', ME.id).order('updatedAt', { ascending:false });
  fail(error);
  const notes = (data||[]).filter(n => (n.html||'').replace(/<[^>]*>/g,'').trim());
  window._MYNOTES = notes;
  $('main').innerHTML = `
    <div class="pagehead">
      <div><h2>${t('myContentT')}</h2><div class="sub">${t('myContentSub')}</div></div>
      ${notes.length ? `<button class="btn" onclick="notesPdf()">⤓ ${t('downloadPdf')}</button>` : ''}
    </div>
    ${notes.length ? notes.map(n => {
      const sm = getSiman(n.simanId);
      const label = (sm ? t('siman') + ' ' + gem(sm.number) + (sm.title? ' · '+esc(sm.title):'') : '') + ' · ' + t('saif') + ' ' + gem(n.saif);
      const preview = esc((n.html||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,180));
      return `<div class="note-prev" onclick="openNoteFromList('${n.simanId}',${n.saif})">
        <div class="h"><span class="badge">${label}</span><span class="hint" style="margin:0">${fmtDate(n.updatedAt)}</span></div>
        <div class="body">${preview}</div>
      </div>`;
    }).join('')
    : `<div class="panel"><div class="empty"><div class="e-ic">📒</div>
        <div class="e-t">${t('emptyNotesT')}</div><div>${t('emptyNotesD')}</div></div></div>`}`;
}
function openNoteFromList(simanId, saif){
  if (!getSiman(simanId)) return;
  CUR.simanId = simanId; CUR.saif = saif; CUR.tab = 'notes'; CUR.view = 'siman';
  renderNav(); renderSiman(); window.scrollTo({top:0});
}
function notesPdf(){
  const notes = window._MYNOTES || [];
  const dir = LANG === 'he' ? 'rtl' : 'ltr';
  const blocks = notes.map(n => {
    const sm = getSiman(n.simanId);
    const label = (sm ? t('siman') + ' ' + gem(sm.number) + (sm.title? ' · '+esc(sm.title):'') : '') + ' · ' + t('saif') + ' ' + gem(n.saif);
    return `<div class="nb"><h2>${label}</h2><div class="nc">${n.html}</div></div>`;
  }).join('');
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="${LANG}" dir="${dir}"><head><meta charset="utf-8">
    <title>${esc(APP_NAME)} · ${t('notesTitlePdf')}</title>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body{font-family:'Assistant',sans-serif;color:#1C1C22;max-width:760px;margin:40px auto;padding:0 24px;line-height:1.8}
      h1{font-family:'Frank Ruhl Libre',serif;font-size:28px;margin-bottom:4px}
      .sub{color:#71717A;margin-bottom:34px;font-size:14px}
      .nb{margin-bottom:34px;page-break-inside:avoid}
      h2{font-family:'Frank Ruhl Libre',serif;font-size:18px;color:#1E4E8C;border-bottom:2px solid #EEF3FA;padding-bottom:6px;margin-bottom:12px}
      @media print{ body{margin:10mm auto} }
    </style></head><body>
    <h1>${esc(APP_NAME)} · ${t('notesTitlePdf')}</h1>
    <div class="sub">${esc(ME.name)} · ${fmtDate(new Date())}</div>
    ${blocks}
    </body></html>`);
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 700);
}

/* ═══════════ Perfil ═══════════ */
async function renderProfile(adminTab){
  CUR.view = 'profile'; renderNav();
  $('main').innerHTML = `
    <div class="panel" style="padding:0;overflow:hidden">
      <div class="profile-top">
        <div class="photo-edit" onclick="$('photo-input').click()" title="${t('changePhoto')}">
          ${avatarHTML(ME,'big')}
          <div class="cam">📷</div>
        </div>
        <div>
          <h2>${esc(ME.name)}</h2>
          <div style="margin-top:6px">${isAdmin()?`<span class="badge gold">${t('adminBadge')}</span>`:`<span class="badge gray">${t('memberBadge')}</span>`}</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
          <button class="btn ghost sm" onclick="openChangePass()">${t('changePass')}</button>
          <button class="btn danger sm" onclick="logout()">${t('logout')}</button>
        </div>
      </div>
    </div>
    ${isAdmin() ? `
      <div class="pagehead" style="margin-top:30px"><div><h2 style="font-size:22px">${t('adminZone')}</h2></div></div>
      <div class="seg" style="max-width:460px">
        <button class="${(adminTab||'pending')==='pending'?'on':''}" onclick="renderProfile('pending')">${t('checkExams')}</button>
        <button class="${adminTab==='users'?'on':''}" onclick="renderProfile('users')">${t('members')}</button>
      </div>
      <div id="adm-body"><div style="padding:40px"><div class="spin"></div></div></div>` : ''}`;
  if (isAdmin()){
    if ((adminTab||'pending') === 'pending') renderAdmPending();
    else renderAdmUsers();
  }
}
$('photo-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const path = 'avatars/' + ME.id.replace(/[^\w]+/g,'_') + '_' + Date.now() + '.' + (file.name.split('.').pop() || 'jpg');
    const { error: e1 } = await sb.storage.from(BUCKET).upload(path, file, { upsert: true });
    fail(e1);
    const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const { error: e2 } = await sb.from(T.users).update({ photo: url }).eq('id', ME.id);
    fail(e2);
    ME.photo = url;
    toast(t('photoUpdated'));
    renderApp(); go('profile');
  } catch(err){ toast(t('err') + err.message); }
  e.target.value = '';
});
function openChangePass(){
  openSheet(`${sheetHead(t('changePass'))}
    <div class="field"><label>${t('newPassLabel')}</label><input id="cp-1" type="password" placeholder="••••••"></div>
    <div class="field"><label>${t('password2')}</label><input id="cp-2" type="password" placeholder="••••••"></div>
    <button class="btn full" onclick="doChangePass()">${t('save')}</button>`);
}
async function doChangePass(){
  const p1 = $('cp-1').value, p2 = $('cp-2').value;
  if (p1.length < 4) return toast(t('errPass4'));
  if (p1 !== p2) return toast(t('errPassMatch'));
  try {
    const salt = randSalt();
    const { error } = await sb.from(T.users).update({ salt, hash: await sha256(salt + p1) }).eq('id', ME.id);
    fail(error);
    closeSheet(); toast(t('passChanged'));
  } catch(e){ toast(t('err') + e.message); }
}

/* ═══════════ Admin: pendientes y usuarios ═══════════ */
async function renderAdmPending(){
  const { data, error } = await sb.from(T.subs).select('*').eq('status','pending').order('createdAt', { ascending:true });
  fail(error);
  const subs = data || [];
  const body = $('adm-body'); if (!body) return;
  body.innerHTML = subs.length ? subs.map(s=>{
    const sm = getSiman(s.simanId);
    return `<div class="exam-card"><div class="exam-top">
      <div class="body">
        <div class="t">${esc(s.userName)}</div>
        <div class="m">${esc(s.examTitle)} · ${sm ? t('siman')+' '+gem(sm.number)+' · ':''}${saifLabel(s.saifim)} · ${fmtDate(s.createdAt)}</div>
      </div>
      <span class="badge gold">${t('pendingBadge')}</span>
    </div>
    <div class="exam-actions"><button class="btn sm" onclick="openGrade('${s.id}')">${t('check')}</button></div>
    </div>`;
  }).join('')
  : `<div class="panel"><div class="empty"><div class="e-ic">✅</div>
      <div class="e-t">${t('noPendingT')}</div><div>${t('noPendingD')}</div></div></div>`;
}
async function renderAdmUsers(){
  const { data, error } = await sb.from(T.users).select('id,name,role,photo').order('name', { ascending:true });
  fail(error);
  const users = data || [];
  const body = $('adm-body'); if (!body) return;
  body.innerHTML = `<div class="panel"><div class="tblwrap"><table class="tbl">
    <tr><th>${t('nameCol')}</th><th>${t('roleCol')}</th><th style="text-align:end"></th></tr>
    ${users.map(u=>`<tr>
      <td><div style="display:flex;align-items:center;gap:10px">${avatarHTML(u)}<b>${esc(u.name)}</b>${u.id===ME.id?` <span class="hint" style="margin:0">${t('youWord')}</span>`:''}</div></td>
      <td>${u.role==='admin'?`<span class="badge gold">${t('adminBadge')}</span>`:`<span class="badge gray">${t('memberBadge')}</span>`}</td>
      <td style="text-align:end;white-space:nowrap">
        ${u.id!==ME.id ? `
          <button class="btn ghost sm" onclick="toggleRole('${u.id}','${u.role}')">${u.role==='admin'?t('removeAdmin'):t('makeAdmin')}</button>
          <button class="btn ghost sm" onclick="resetPass('${u.id}')">${t('resetPassBtn')}</button>
          <button class="iconbtn" onclick="deleteUser('${u.id}')" title="${t('delUserT')}">🗑️</button>` : ''}
      </td>
    </tr>`).join('')}
  </table></div></div>`;
}
async function toggleRole(id, role){
  try {
    const { error } = await sb.from(T.users).update({ role: role==='admin' ? 'member' : 'admin' }).eq('id', id);
    fail(error);
    toast(t('roleUpdated')); renderProfile('users');
  } catch(e){ toast(t('err') + e.message); }
}
async function resetPass(id){
  const { data } = await sb.from(T.users).select('name').eq('id', id).maybeSingle();
  const name = data ? data.name : '';
  openSheet(`${sheetHead(t('resetPassBtn') + ' · ' + esc(name))}
    <div class="field"><label>${t('newPassLabel')}</label><input id="rp-pass" type="text" placeholder="${t('min4')}"></div>
    <button class="btn full" onclick="doResetPass('${id}')">${t('save')}</button>`);
}
async function doResetPass(id){
  const p = $('rp-pass').value;
  if (p.length < 4) return toast(t('min4'));
  try {
    const salt = randSalt();
    const { error } = await sb.from(T.users).update({ salt, hash: await sha256(salt + p) }).eq('id', id);
    fail(error);
    closeSheet(); toast(t('passReset'));
  } catch(e){ toast(t('err') + e.message); }
}
async function deleteUser(id){
  const { data } = await sb.from(T.users).select('name').eq('id', id).maybeSingle();
  const name = data ? data.name : '';
  if (!await confirmDlg(name + t('delUserConfirm'))) return;
  try {
    await sb.from(T.subs).delete().eq('userId', id);
    await sb.from(T.notes).delete().eq('userId', id);
    const { error } = await sb.from(T.users).delete().eq('id', id); fail(error);
    toast(t('userDeleted')); renderProfile('users');
  } catch(e){ toast(t('err') + e.message); }
}

/* ═══════════ Go ═══════════ */
boot();
</script>
</body>
</html>
