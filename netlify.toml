# Sitio de una sola página: no hay build, se publica la raíz del repo tal cual.
[build]
  publish = "."

# El HTML no debe quedar cacheado: si no, un cambio publicado no se ve hasta
# que el visitante fuerza la recarga.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El RSS del podcast (lo arma tools/jabura_publicar.py) vive junto a la app.
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"
